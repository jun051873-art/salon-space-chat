<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>測試帳戶登入 · 專屬空間</title><style>body{margin:0;background:#f6f3ee;color:#302f2b;font:16px/1.7 system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:28px;background:white;border-radius:24px}label,input,button{display:block;box-sizing:border-box;width:100%}input,button{font:inherit;padding:12px;border:1px solid #b9b4ab;border-radius:12px;margin:8px 0 20px}button{background:#3e594f;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#385b50}#status{min-height:2em}@media(max-width:500px){main{margin:20px 12px}}</style></head><body><main><h1>測試帳戶登入</h1><p>Review account sign-in</p><p>僅供已取得測試帳戶的人員使用。登入後會進入正式客人端，訊息會送達店家。<br>Messages sent here will reach the salon.</p><form id="login"><label for="email">電子郵件 / Email</label><input id="email" type="email" autocomplete="username" required><label for="password">密碼 / Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" disabled>登入 / Sign in</button></form><p id="status" role="status" aria-live="polite">檢查登入狀態… / Checking session…</p><a href="./customer.html">返回客人端 / Back</a></main><script type="module" src="./customer-review-login.js"></script></body></html>
