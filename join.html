<p class="brand">專屬空間</p><h1 class="headline">我們有新的聯絡小天地了</h1><p class="features">店休公告・最新活動・服務與預約詢問</p>

<h2 class="tagline">掃碼加入，之後在這裡找我們</h2><p class="description">休假與活動消息，都幫你放在這裡。<br>想換個髮型、問問時間？傳個訊息就好。</p>

</main>
<section class="actions" aria-label="開啟與下載"><div class="shareActions"><button class="primary" id="copyJoinLink" type="button">複製客人加入連結</button><button id="shareJoinLink" type="button" hidden>分享給客人</button></div><p id="shareStatus" role="status" aria-live="polite"></p><label class="linkLabel" for="joinLink">客人加入網址</label><input id="joinLink" readonly aria-label="客人加入網址"><p class="linkHint">可貼到 LINE 或訊息；請客人用 Safari 或 Chrome 開啟。</p><a class="button secondary" href="./customer.html" target="_blank" rel="noopener">另開客人端預覽 ↗</a><div class="help"><p><b>iPhone</b>：用 Safari 開啟 → 分享 → 加入主畫面</p><p><b>Android</b>：用 Chrome 開啟 → 選單 → 安裝應用程式／加入主畫面</p><p>預約為訊息詢問，時間以店家回覆確認為準。</p></div><div class="downloads"><button id="printPoster" type="button">列印完整海報</button><button id="downloadPoster" type="button">下載海報圖片</button></div><a class="tiny-link" href="./customer-qr.svg" download="專屬空間-QR碼.svg">只下載 QR 碼</a><p id="downloadStatus" role="status" aria-live="polite"></p></section>
<script>
(()=>{
 let leaving=false;
 const fallback=new URLSearchParams(location.search).get('from')==='admin'?'./admin.html':'./customer.html';
 function back(){if(leaving)return;leaving=true;let internal=false;try{const ref=new URL(document.referrer);internal=ref.origin===location.origin&&ref.pathname.startsWith('/salon-space-chat/');}catch{}if(internal&&history.length>1)history.back();else location.replace(fallback);}
 document.getElementById('goBack').addEventListener('click',back);
 addEventListener('pageshow',()=>{leaving=false;});
})();
</script><script>
const joinUrl=new URL('./customer.html',location.href).href;
const joinInput=document.getElementById('joinLink'),shareStatus=document.getElementById('shareStatus');joinInput.value=joinUrl;
joinInput.onclick=()=>joinInput.select();
document.getElementById('copyJoinLink').onclick=async()=>{
 try{await navigator.clipboard.writeText(joinUrl);shareStatus.textContent='連結已複製，可貼給客人。';}
 catch{joinInput.focus();joinInput.select();joinInput.setSelectionRange(0,joinInput.value.length);let copied=false;try{copied=document.execCommand('copy');}catch{}shareStatus.textContent=copied?'連結已複製，可貼給客人。':'請長按上方網址，選擇「複製」。';}
};
const shareButton=document.getElementById('shareJoinLink');
if(typeof navigator.share==='function'){shareButton.hidden=false;shareButton.onclick=async()=>{try{await navigator.share({title:'專屬空間',text:'加入我們的聯絡小天地',url:joinUrl});}catch(e){if(e.name!=='AbortError')shareStatus.textContent='請使用「複製客人加入連結」分享。';}};}
document.getElementById('printPoster').onclick=()=>window.print();
document.getElementById('downloadPoster').onclick=async()=>{
 const button=document.getElementById('downloadPoster'),status=document.getElementById('downloadStatus');button.disabled=true;status.textContent='正在準備海報…';
 try{
 const qr=new Image();qr.src='./customer-qr.svg';await qr.decode();
 await document.fonts.ready;
 const c=document.createElement('canvas');c.width=1400;c.height=1980;const x=c.getContext('2d');
 x.fillStyle='#fff8ef';x.fillRect(0,0,1400,1980);
 function pill(a,b,w,h,color){x.fillStyle=color;x.beginPath();x.roundRect(a,b,w,h,h/2);x.fill();}
 function text(s,y,size=40,weight=500,color='#352e29'){x.fillStyle=color;x.font=weight+' '+size+'px system-ui, sans-serif';x.textAlign='center';x.fillText(s,700,y,1280);}
 pill(-120,-95,500,220,'#dce3c5');pill(1100,1870,450,210,'#f6d5d7');pill(360,110,680,150,'#f6d5d7');text('專屬空間',215,86,800);
 text('我們有新的聯絡小天地了',365,65,800);text('店休公告・最新活動・服務與預約詢問',445,38,600);
 x.fillStyle='white';x.fillRect(290,505,820,820);x.drawImage(qr,300,515,800,800);
 for(const side of [-1,1]){x.save();x.translate(700+side*530,1180);x.scale(-side,1);x.strokeStyle='#99aa78';x.lineWidth=7;x.beginPath();x.moveTo(45,85);x.quadraticCurveTo(-25,0,0,-110);x.stroke();for(let i=0;i<4;i++){x.fillStyle=side<0?'#acba8d':'#dfa3ab';x.beginPath();x.ellipse((i%2?25:-16),-90+i*45,19,side<0?32:20,(i%2?.5:-.6),0,Math.PI*2);x.fill();}x.restore();}
 pill(95,1380,1210,120,'#dce3c5');text('掃碼加入，之後在這裡找我們',1460,55,800);
 text('休假與活動消息，都幫你放在這裡。',1570,40);text('想換個髮型、問問時間？傳個訊息就好。',1635,40);
 pill(95,1750,1210,170,'#f9dfe0');pill(470,1705,460,85,'#f3c5ca');text('加入前的小提醒',1765,42,700);text('先加入手機主畫面，再填寫資料開始使用。',1835,35);text('完成後開啟通知，讓我們的回覆找得到你。',1890,33);
 const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('export');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='專屬空間-聯絡小天地海報.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='海報已準備好；若開啟圖片，請長按儲存。';
 }catch(e){status.textContent='圖片暫時無法下載，請稍後重試，或使用「列印完整海報」。';}finally{button.disabled=false;}
};
