<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入專屬空間</title><style>body{background:#f5f1ea;color:#292722;font:18px/1.7 system-ui;text-align:center;padding:30px}main{max-width:520px;margin:auto;background:white;padding:30px;border-radius:32px}img{width:280px;max-width:100%;display:block;margin:auto}h1{font-size:30px}a,button{display:inline-block;background:#292722;color:white;padding:12px 20px;border:0;border-radius:99px;font:inherit;text-decoration:none;margin:8px}small{display:block;color:#756f66}nav{position:sticky;top:0;z-index:2;text-align:left;padding-top:env(safe-area-inset-top);background:#f5f1eae8;backdrop-filter:blur(12px)}nav button{font-size:16px;margin:0 0 12px}body{margin:0;padding:12px 20px 30px}main{padding:24px}button{min-height:44px;cursor:pointer}@media print{nav{display:none}body{background:white;padding:0}button{display:none}main{max-width:none}img{width:300px}}</style><nav aria-label="頁面導覽"><button id="goBack" type="button">‹ 返回上一頁</button></nav><main><small>YOUR SALON · 專屬空間</small><h1>掃一下，和我們保持聯繫</h1><img src="./customer-qr.svg" alt="掃描加入專屬空間的 QR 碼"><p>預約時間 · 聊天詢問 · 店家新消息</p><a href="./customer.html">在這台手機開啟</a><p>iPhone：Safari 分享 → 加入主畫面<br>Android：Chrome → 安裝到桌面</p><small>掃描後會開啟網頁，安裝需要你按下確認。<br>加入桌面後，再開啟通知。</small><button onclick="print()">列印櫃台 QR 碼</button><a href="./customer-qr.svg" download>下載 QR 碼</a></main><script>
(()=>{
 let leaving=false,start=null,swipe=false;
 const fallback=new URLSearchParams(location.search).get('from')==='admin'?'./admin.html':'./customer.html';
 function back(){if(leaving)return;leaving=true;let internal=false;try{const ref=new URL(document.referrer);internal=ref.origin===location.origin&&ref.pathname.startsWith('/salon-space-chat/');}catch{}if(internal&&history.length>1)history.back();else location.replace(fallback);}
 document.getElementById('goBack').addEventListener('click',back);
 addEventListener('pageshow',()=>{leaving=false;start=null;swipe=false;});
 document.addEventListener('touchstart',e=>{swipe=false;const t=e.touches[0];start=e.touches.length===1&&t.clientX<28?{x:t.clientX,y:t.clientY}:null;},{passive:true});
 document.addEventListener('touchmove',e=>{if(!start||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-start.x,dy=Math.abs(t.clientY-start.y);if(dy>35){start=null;return;}if(dx>60&&dx>dy*2&&e.cancelable){e.preventDefault();swipe=true;}},{passive:false});
 document.addEventListener('touchend',()=>{if(swipe)back();start=null;swipe=false;},{passive:true});
 document.addEventListener('touchcancel',()=>{start=null;swipe=false;},{passive:true});
})();
</script></html>
