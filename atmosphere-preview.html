<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N43 氣氛美術預覽</title><link rel="stylesheet" href="salon-theme.css?v=N43"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0ea;color:#514b49;font:15px system-ui}main{max-width:1050px;margin:auto;padding:38px 24px;display:grid;grid-template-columns:1fr 390px;gap:56px}.eyebrow{font-size:11px;letter-spacing:4px;color:#9f867d}h1{font:38px Georgia,serif;line-height:1.35;margin:18px 0}p{line-height:1.9;color:#827671}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}button{border:1px solid #dcd2c9;border-radius:24px;background:#faf8f4;padding:10px 16px;color:#6a6059;cursor:pointer}button[aria-pressed=true]{background:#8e746b;color:white;border-color:#8e746b}.phone{position:relative;height:680px;border:8px solid #fff;border-radius:40px;overflow:hidden;background:linear-gradient(145deg,#f7ebe9,#f6f2eb 48%,#e8eee9);box-shadow:0 25px 70px #8c776622}.sceneEffects{position:absolute;inset:0;pointer-events:none}.profile{position:relative;z-index:2;padding:42px 26px;pointer-events:none}.top{font-size:11px;letter-spacing:3px;color:#9a8780}.avatar{width:76px;height:76px;border-radius:50%;background:#d6bdb3;color:white;display:grid;place-items:center;margin:80px auto 18px;font:36px Georgia}h2{text-align:center;font-weight:500;font-size:25px;letter-spacing:4px}.sub{text-align:center;font-size:12px;letter-spacing:2px}.card{margin-top:42px;border:1px solid #ffffffb0;background:#ffffff55;border-radius:22px;padding:22px;line-height:2.2;font-size:13px}.tag{font-size:11px;text-align:center;margin-top:50px;color:#a28f84}.ambientScene{z-index:1}.foot{font-size:12px;color:#9a8e86}@media(max-width:750px){main{display:flex;flex-direction:column;gap:24px;padding:24px 18px}.phone{width:100%;max-width:390px;align-self:center;height:610px}h1{font-size:30px}}
</style><main><section><div class="eyebrow">SALON · ATMOSPHERE STUDIES</div><h1>讓季節，<br>輕輕走進你的版面。</h1><p id="description">花瓣在不同景深裡翻轉、飄落。柔和花色留下春天的呼吸。</p><div class="choices" id="choices"></div><button id="replay">重新播放 12 秒</button><p class="foot">此頁使用正式版同一個動畫引擎。示意人物與文字不連接客戶資料。</p></section><section class="phone"><div class="sceneEffects" id="fx"></div><div class="profile"><div class="top">PERSONAL SPACE　 /　01</div><div class="avatar">S</div><h2>你的專屬時光</h2><div class="sub">BEAUTY IN EVERY SEASON</div><div class="card">每一次相遇，都留下一點美好。<br>把喜歡的季節，留在自己的空間裡。</div><div class="tag" id="name">櫻花 · 花瓣漫舞</div></div></section></main><script type="module">
import{scenes,mountAmbient}from'./ambient-scenes.js?v=N43';
const notes={petals:'花瓣在不同景深裡翻轉、飄落。柔和花色留下春天的呼吸。',rain:'細雨斜斜落下，遠近雨絲有不同速度，底部漣漪慢慢散開。',snow:'細碎遠雪與柔焦近雪交錯，輕輕搖擺、緩慢落下。',sun:'溫暖光暈、緩轉光束與空氣裡的細小浮塵。',fireflies:'忽明忽暗的螢光，沿著各自的弧線慢慢游移。'};let cleanup=()=>{},selected='petals';function play(key){selected=key;cleanup();cleanup=mountAmbient(document.querySelector('#fx'),{effect:key,duration:12});document.querySelector('#description').textContent=notes[key]||'每一種氣氛都有自己的色彩、材質與動態節奏。';document.querySelector('#name').textContent=scenes[key][0]+' · 季節氣氛';document.querySelectorAll('[data-effect]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.effect===key)})}for(const[key,[label]]of Object.entries(scenes)){const b=document.createElement('button');b.textContent=label;b.dataset.effect=key;b.onclick=()=>play(key);document.querySelector('#choices').append(b)}document.querySelector('#replay').onclick=()=>play(selected);play(selected);
</script></html>
