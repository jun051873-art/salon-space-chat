 retryAll.hidden=failedWrites.length===0;retryAll.onclick=()=>{const count=delivery.retryFailed(failedWrites.map(e=>e.id));if(!count)$('chatWrite').textContent='這些訊息已不在待傳佇列，請重新整理聊天室。';};
 const pushError=push.find(e=>e.error)?.error||"",pushCode=pushError.match(/"(?:error|code)":"([A-Z0-9_-]+)"/)?.[1]||(/逾時|TIMEOUT|AbortError/.test(pushError)?'TIMEOUT':pushError?'PUSH_FAILED':'');
 const pushExplanation=pushCode==='NO_DEVICE_TOKENS'?'對方尚未完成通知設定，請對方在使用的手機開啟通知。':/UNREGISTERED|NOT_FOUND/.test(pushCode)?'對方的通知登記已失效，請對方重新開啟通知。':pushCode==='TIMEOUT'?'通知服務回應逾時，系統會重試；訊息不會重複傳送。':pushCode?'通知未完成（'+pushCode+'），訊息已保留。':'正在確認對方手機通知…';
 $("pushStatus").textContent=push.length?'訊息已送出。'+pushExplanation:"";
 let hint=document.getElementById('deliveryHint');if(!hint){hint=document.createElement('button');hint.id='deliveryHint';hint.type='button';hint.setAttribute('role','status');document.querySelector('.composer').before(hint);}const failed=push.some(e=>e.stage==='notify-error');hint.hidden=!failed;hint.textContent='訊息已送出，手機提醒尚未完成。點此重試通知';hint.onclick=()=>delivery.retryFailed();
}
function watchChat(room,el,viewer){
 document.activeElement?.blur?.();
 if(currentChatView?.room===room){currentChatView.first=true;pinChatBottom(currentChatView);currentChatView.feed.start();suite?.attachChat(currentChatView);return;}
 currentChatView?.stopBottom?.();activeChatUnsubscribe?.();clearTimeout(activeReadTimer);
 ensureChatStatus(room);$("chatRead").textContent="正在連接雲端訊息…";
 const v={room,el,viewer,docs:[],more:false,loading:false,first:true};currentChatView=v;
 const ref=collection(db,"chats",room,"messages");
 const feed=createPagedFeed({field:"createdAt",pageSize:30,
  subscribe:(next,error)=>onSnapshot(query(ref,orderBy("createdAt","desc"),limit(30)),{includeMetadataChanges:true},next,error),
  fetchPage:cursor=>getDocsFromServer(query(ref,orderBy("createdAt","desc"),startAfter(cursor),limit(30))),
  onChange:state=>{
   if(currentChatView!==v)return;
   v.docs=state.docs.slice().reverse();v.more=state.more;v.loading=state.loading;
   if(state.reason==="live"||state.reason==="reset"){clearTimeout(activeReadTimer);$("chatRead").textContent="已取得雲端訊息";}
   if(state.reason==="cache")$("chatRead").textContent="目前顯示本機資料，等待雲端確認…";
   if(!state.fromCache&&state.ready)delivery.acknowledge(state.docs.filter(d=>!d.metadata.hasPendingWrites).map(d=>d.id));
   renderChatView(state.reason);
  },onError:e=>{if(currentChatView===v){clearTimeout(activeReadTimer);$("chatRead").textContent="讀取失敗："+chatError(e);}}
 });
 v.feed=feed;activeChatUnsubscribe=()=>feed.destroy();renderChatView();delivery.resume();
 activeReadTimer=setTimeout(()=>{if(currentChatView===v)$("chatRead").textContent="尚未取得雲端回應，正在等待重新連線。"},12000);
 feed.start();suite?.attachChat(v);
}
function transmitChat(room,t,sender,role,input,button){
 if(!t.trim())return;
 ensureChatStatus(room);
 try{delivery.enqueue({room,text:t,senderId:sender});input.value="";button.disabled=false;input.disabled=false;input.dispatchEvent(new Event("input",{bubbles:true}));}
 catch(e){$("chatWrite").textContent="尚未送出，原文仍在輸入框："+e.message;}
}
window.addEventListener("online",()=>delivery.resume());
function pauseAdminListIfPresent(){adminFeed?.pause();}
function resumeVisibleReads(){if(!$("adminChat").classList.contains("hidden"))currentChatView?.feed.start();else if(!$("admin").classList.contains("hidden"))startAdminList();}
let backgroundReadTimer=null;
document.addEventListener("visibilitychange",()=>{
 clearTimeout(backgroundReadTimer);
 if(document.visibilityState==="hidden")backgroundReadTimer=setTimeout(()=>{currentChatView?.feed.pause();pauseAdminListIfPresent();},60000);
 else {delivery.resume();resumeVisibleReads();}
});
onAuthStateChanged(auth,()=>delivery.resume());

let messaging=null, messagingPromise=null;
function supportsPushAPIs(){return "Notification" in window && "PushManager" in window && "serviceWorker" in navigator;}
async function getChatMessaging(){
 if(!supportsPushAPIs())return null;
 if(!messagingPromise)messagingPromise=(async()=>{
  try{if(!await isSupported())return null;messaging=getMessaging(app);onMessage(messaging,payload=>window.dispatchEvent(new CustomEvent('salon:foreground-message',{detail:payload.data||{}})));return messaging;}
  catch(e){console.warn("通知功能無法啟用；聊天仍可使用",e);return null;}
 })();
 const pending=messagingPromise,result=await pending;
 if(!result&&messagingPromise===pending)messagingPromise=null;
 return result;
}

const notificationHelp=mountNotificationHelp($("adminHome"),()=>enableAdminNotify(),"admin");
window.addEventListener('salon:resume',()=>{if(auth.currentUser?.uid===ADMIN){delivery.resume();resumeVisibleReads();if(Date.now()-pushCheckedAt>60000){pushCheckedAt=Date.now();void syncPushToken(auth.currentUser,'admin');}}});
let pushCheckedAt=0;document.addEventListener("visibilitychange",()=>{if(!document.hidden&&auth.currentUser?.uid===ADMIN&&Date.now()-pushCheckedAt>60000){pushCheckedAt=Date.now();void syncPushToken(auth.currentUser,"admin");}});
function deviceId(){let id=localStorage.getItem("salonDeviceId");if(!id){id=(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)));localStorage.setItem("salonDeviceId",id)}return id}
function deviceLabel(){const ua=navigator.userAgent;const platform=navigator.platform||"";if(/iPad/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))return"iPad";if(/iPhone/i.test(ua))return"iPhone";if(/Android/i.test(ua)&&!/Mobile/i.test(ua))return"Android Tablet";if(/Android/i.test(ua))return"Android Phone";if(/Mac/i.test(platform)||/Macintosh/i.test(ua))return"Mac";if(/Win/i.test(platform)||/Windows/i.test(ua))return"Windows";return"Other"}function show(x,{keepSplash=false}={}){["login","adminHome","adminTool","admin","adminAnalysis","adminChat"].forEach(i=>{const el=$(i);if(el)el.classList.toggle("hidden",i!==x)});if(!keepSplash){const s=document.getElementById("bootSplash");if(s)s.remove()}}function listen(u,el,viewer){watchChat(u,el,viewer)}function updateAdminNotifyUI(ok=false){notificationHelp.update(ok);const b=$("adminNotifyBox");if(!b)return;if(!supportsPushAPIs()){$("adminNotify").classList.add("hidden");$("adminNotifyStatus").textContent="此系統不支援背景通知；開啟聊天室仍可收發訊息。";b.classList.remove("hidden");return;}if(ok&&Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPushToken(user,role){
 try{
  if(!supportsPushAPIs()||Notification.permission!=="granted"){if(role==="admin")updateAdminNotifyUI(false);return;}
  const messaging=await getChatMessaging();if(!messaging){updateAdminNotifyUI(false);return;}
  const reg=await ensureNotificationWorker();
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(token){await savePushToken("pushTokens/"+user.uid+"/devices/"+deviceId(),{token,uid:user.uid,role,deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent});if(role==="admin")updateAdminNotifyUI(true)}else if(role==="admin")updateAdminNotifyUI(false);
 }catch(e){console.warn("push sync",e);if(role==="admin"){updateAdminNotifyUI(false);notificationHelp.update(false,e.message);}}
}
function showAdminPage(id){
 const splash=$("bootSplash");
 if(id==="admin"&&!$("admin").classList.contains("hidden")){if(suite?.demo)suite.demoList();else startAdminList();return;}
 closeChatListener();adminFeed?.pause();
 const pages=["adminHome","admin","adminAnalysis"];
 if(!pages.includes(id))id="adminHome";
 ["login","adminHome","adminTool","admin","adminAnalysis","adminChat","adminNav"].forEach(x=>{const el=$(x);if(el)el.style.removeProperty("display")});
 show(id,{keepSplash:!!splash});const rendered=suite?.page(id);if(splash?.isConnected)void releaseCoverAfter(rendered,splash,()=>!$(id).classList.contains("hidden"));
 if(id==="admin"){if(suite?.demo)suite.demoList();else startAdminList();}
 $("adminNav")?.classList.remove("hidden");
 document.querySelectorAll("#adminNav [data-admin-page]").forEach(b=>b.classList.toggle("active",b.dataset.adminPage===id));
}
$("adminNav")?.addEventListener("click",e=>{const b=e.target.closest("#adminNav [data-admin-page]");if(!b)return;e.preventDefault();e.stopPropagation();showAdminPage(b.dataset.adminPage)});
const TOOL_NAMES={broadcast:"群發訊息",welcome:"新客歡迎",autoreply:"自動回覆",notice:"公告・休假",gallery:"商品管理",customers:"客戶管理",tags:"標籤分類",settings:"設定",phrases:"常用訊息設定"};
function openTool(key){
 adminFeed?.pause();closeChatListener();
 show("adminTool");$("adminNav").classList.remove("hidden");$("toolTitle").textContent=TOOL_NAMES[key]||"功能";
 suite?.openTool(key);
}
document.querySelectorAll(".toolItem[data-tool]").forEach(b=>b.onclick=()=>openTool(b.dataset.tool));
$("toolBack").onclick=()=>{showAdminPage("adminHome")};
async function openCustomerChat(uidToOpen){
 sel=uidToOpen;adminFeed?.pause();
 const hideIds=["login","adminHome","adminTool","admin","adminAnalysis","adminNav"];
 hideIds.forEach(id=>{const el=$(id);if(el){el.classList.add("hidden");el.style.display="none"}});
 const chat=$("adminChat");
 chat.classList.remove("hidden");
 chat.style.display="block";
 $("who").textContent="聊天室";$("adminCustomerPill").textContent="客人";
 listen(uidToOpen,$("adminMsgs"),ADMIN);
 const known=adminFeed?.entries().find(d=>d.id===uidToOpen)?.data();
 if(known?.name){$("who").textContent=known.adminName||known.name;$("adminCustomerPill").textContent=(known.adminName||known.name);return;}
 try{const u=await getDoc(doc(db,"users",uidToOpen));if(sel===uidToOpen){$("who").textContent=u.data()?.name||"客人";$("adminCustomerPill").textContent=(u.data()?.adminName||u.data()?.name||"客人");}}catch(e){if(sel===uidToOpen)$("chatRead").textContent="客戶資料讀取失敗："+chatError(e);}
}
$("adminCustomerPill").onclick=async()=>{if(!sel)return;try{const snap=await getDoc(doc(db,"users",sel));if(!snap.exists())throw Error("找不到客戶資料");const event=new CustomEvent("salon:edit-chat-customer",{detail:{id:sel}});document.dispatchEvent(event);const name=prompt("店家顯示名稱（不更改客人自行填寫的姓名）",snap.data()?.adminName||snap.data()?.name||"");if(name===null)return;const next=name.trim();if(!next||next.length>80){alert("請輸入 1～80 字的名稱");return;}await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js").then(async m=>m.setDoc(doc(db,"users",sel),{adminName:next},{merge:true}));$("adminCustomerPill").textContent=next;$("who").textContent=next;}catch(e){alert("修改失敗："+e.message)}};
let adminFeed=null;
function startAdminList(){
 if(!adminFeed){
  const ref=collection(db,"chats");
  adminFeed=createPagedFeed({field:"updatedAt",pageSize:30,
   subscribe:(next,error)=>onSnapshot(query(ref,orderBy("updatedAt","desc"),limit(30)),{includeMetadataChanges:true},next,error),
   fetchPage:cursor=>getDocsFromServer(query(ref,orderBy("updatedAt","desc"),startAfter(cursor),limit(30))),
   onChange:state=>{
    suite?.renderInbox(state.docs,{more:state.more,loading:state.loading,loadMore:()=>adminFeed.loadMore()});
   },onError:e=>{$("list").textContent="客戶列表讀取失敗："+chatError(e);}
  });
 }
 adminFeed.start();
}
async function openAdminHome(){
 $("adminNav").classList.remove("hidden");showAdminPage("adminHome");
 void syncPushToken(auth.currentUser,"admin");
 const target=new URLSearchParams(location.search).get("chat");
 if(target||new URLSearchParams(location.search).get('view')==='messages'){history.replaceState(null,'',location.pathname);showAdminPage('admin')}else if(new URLSearchParams(location.search).get('view')==='approvals'){history.replaceState(null,'',location.pathname);openTool('approvals');}
}
async function routeNotification(m){if(auth.currentUser?.uid!==ADMIN||!m?.url)return;try{const u=new URL(m.url,location.href);if(u.origin!==location.origin||u.pathname!==location.pathname)return;const target=u.searchParams.get("chat");if(target||u.searchParams.get('view')==='messages')showAdminPage('admin');else if(u.searchParams.get('view')==='approvals')openTool('approvals');}catch(e){console.warn('notification route',e)}}
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='OPEN_NOTIFICATION_URL')void routeNotification(e.data);});
window.addEventListener('salon:open-notification',e=>void routeNotification(e.detail));
onAuthStateChanged(auth,async user=>{
 if(suite?.demo)return;
 if(user?.uid!==ADMIN){adminFeed?.destroy();adminFeed=null;currentChatView?.feed?.pause();closeChatListener();suite?.stopUnread();document.querySelectorAll('dialog[open]').forEach(d=>d.close());$('adminNav').classList.add('hidden');document.body.classList.remove('conversationOpen');document.documentElement.classList.remove('conversationOpen');if(booted)$('err').textContent='店家登入已失效，請重新登入。';booted=false;show('login');return;}
 if(booted)return;
 booted=true;
 if(user?.uid===ADMIN){await openAdminHome();return}
 show("login");
});
$("go").onclick=async()=>{
 $("err").textContent="登入中…";
 try{
  await setPersistence(auth,browserLocalPersistence);
  const cred=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value);
  if(cred.user.uid!==ADMIN){await signOut(auth);throw Error("非管理員帳號")}
  localStorage.setItem("salonAdminLoggedIn","1");
  $("err").textContent="";

};async function enableAdminNotify(){try{if(!auth.currentUser||auth.currentUser.uid!==ADMIN)throw Error("請先登入店家後台");if(!supportsPushAPIs()||Notification.permission==="denied"){notificationHelp.guide();return;}const perm=Notification.permission==="granted"?"granted":await Notification.requestPermission();if(perm!=="granted")throw Error("尚未允許通知");const messaging=await getChatMessaging();if(!messaging)throw Error("通知服務暫時無法啟動，請確認網路後重試");const reg=await ensureNotificationWorker();const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});if(!token)throw Error("未取得通知識別碼");await savePushToken("pushTokens/"+ADMIN+"/devices/"+deviceId(),{token,uid:ADMIN,role:"admin",deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent});$("adminNotifyStatus").textContent="✅ 這台裝置已開啟店家通知";updateAdminNotifyUI(true);}catch(e){notificationHelp.update(false,"通知設定失敗："+e.message);$("adminNotifyStatus").textContent="⚠️ 店家通知設定失敗："+e.message}}$("adminNotify").onclick=enableAdminNotify;$("replyBtn").onclick=()=>transmitChat(sel,$("reply").value,ADMIN,"admin",$("reply"),$("replyBtn"));$("back").onclick=()=>{
 const chat=$("adminChat");chat.classList.add("hidden");chat.style.display="none";
 ["admin","adminNav"].forEach(id=>{const el=$(id);if(el)el.style.display=""});
 showAdminPage("admin");
};

suite=installSuite({auth,db,role:CHAT_ROLE,delivery,getChat:()=>currentChatView,renderChat:renderChatView,openChat:openCustomerChat,showPage:showAdminPage,openTool});
