const tokenSaves=new Map();
function savePushToken(path,values){
 const key=auth.currentUser?.uid+":"+path+":"+JSON.stringify(values);
 if(tokenSaves.has(key))return tokenSaves.get(key);
 const task=writePushToken(path,values).catch(e=>{tokenSaves.delete(key);throw e;});
 tokenSaves.set(key,task);return task;
}
async function writePushToken(path,values){
 try{const old=await delivery.api("/"+path);if(Object.entries(values).every(([k,v])=>old.fields?.[k]?.stringValue===String(v)))return;}catch(e){if(e.status!==404)throw e;}

 const fields=Object.fromEntries(Object.entries(values).map(([k,v])=>[k,{stringValue:String(v)}]));

}

function watchChat(room,el,viewer){

}

function deviceId(){let id=localStorage.getItem("salonDeviceId");if(!id){id=(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)));localStorage.setItem("salonDeviceId",id)}return id}
function deviceLabel(){const ua=navigator.userAgent;const platform=navigator.platform||"";if(/iPad/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))return"iPad";if(/iPhone/i.test(ua))return"iPhone";if(/Android/i.test(ua)&&!/Mobile/i.test(ua))return"Android Tablet";if(/Android/i.test(ua))return"Android Phone";if(/Mac/i.test(platform)||/Macintosh/i.test(ua))return"Mac";if(/Win/i.test(platform)||/Windows/i.test(ua))return"Windows";return"Other"}function show(x){["login","adminHome","adminTool","admin","adminAnalysis","adminChat"].forEach(i=>{const el=$(i);if(el)el.classList.toggle("hidden",i!==x)});const s=document.getElementById("bootSplash");if(s)s.remove()}function listen(u,el,viewer){watchChat(u,el,viewer)}function updateAdminNotifyUI(ok=false){const b=$("adminNotifyBox");if(!b)return;if(!supportsPushAPIs()){$("adminNotify").classList.add("hidden");$("adminNotifyStatus").textContent="此系統不支援背景通知；開啟聊天室仍可收發訊息。";b.classList.remove("hidden");return;}if(ok&&Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPushToken(user,role){
 try{
  if(!supportsPushAPIs()||Notification.permission!=="granted"){if(role==="admin")updateAdminNotifyUI(false);return;}
  const messaging=await getChatMessaging();if(!messaging)return;
  const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js?v=A-RECOVERY-01",{updateViaCache:"none"});await reg.update();
  await navigator.serviceWorker.ready;
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(token){await savePushToken("pushTokens/"+user.uid+"/devices/"+deviceId(),{token,uid:user.uid,role,deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent});if(role==="admin")updateAdminNotifyUI(true)}else if(role==="admin")updateAdminNotifyUI(false);
 }catch(e){console.warn("push sync",e);if(role==="admin")updateAdminNotifyUI(false)}
}
function showAdminPage(id){
 if(id==="admin"&&!$("admin").classList.contains("hidden")){if(suite?.demo)suite.demoList();else startAdminList();return;}
 closeChatListener();adminFeed?.pause();
 const pages=["adminHome","admin","adminAnalysis"];
 if(!pages.includes(id))id="adminHome";
 ["login","adminHome","adminTool","admin","adminAnalysis","adminChat","adminNav"].forEach(x=>{const el=$(x);if(el)el.style.removeProperty("display")});
 show(id);suite?.page(id);
 if(id==="admin"){if(suite?.demo)suite.demoList();else startAdminList();}
 $("adminNav")?.classList.remove("hidden");
 document.querySelectorAll("#adminNav [data-admin-page]").forEach(b=>b.classList.toggle("active",b.dataset.adminPage===id));
}
$("adminNav")?.addEventListener("click",e=>{const b=e.target.closest("#adminNav [data-admin-page]");if(!b)return;e.preventDefault();e.stopPropagation();showAdminPage(b.dataset.adminPage)});
const TOOL_NAMES={broadcast:"群發訊息",welcome:"新客歡迎",autoreply:"自動回覆",notice:"公告・休假",gallery:"商品管理",customers:"客戶管理",tags:"標籤分類",settings:"設定"};
function openTool(key){
 adminFeed?.pause();closeChatListener();
 show("adminTool");$("adminNav").classList.remove("hidden");$("toolTitle").textContent=TOOL_NAMES[key]||"功能";
 suite?.openTool(key);
}
document.querySelectorAll(".toolItem[data-tool]").forEach(b=>b.onclick=()=>openTool(b.dataset.tool));
$("toolBack").onclick=()=>{showAdminPage("adminHome")};
async function openCustomerChat(uidToOpen){
 sel=uidToOpen;adminFeed?.pause();
 const hideIds=["login","adminHome","adminTool","admin","adminAnalysis","adminNav"];
 hideIds.forEach(id=>{const el=$(id);if(el){el.classList.add("hidden");el.style.display="none"}});
 const chat=$("adminChat");
 chat.classList.remove("hidden");
 chat.style.display="block";
 $("who").textContent="聊天室";
 listen(uidToOpen,$("adminMsgs"),ADMIN);
 const known=adminFeed?.entries().find(d=>d.id===uidToOpen)?.data();
 if(known?.name){$("who").textContent=known.name;return;}
 try{const u=await getDoc(doc(db,"users",uidToOpen));if(sel===uidToOpen)$("who").textContent=u.data()?.name||"客人";}catch(e){if(sel===uidToOpen)$("chatRead").textContent="客戶資料讀取失敗："+chatError(e);}
}
let adminFeed=null;
function startAdminList(){
 if(!adminFeed){
  const ref=collection(db,"chats");
  adminFeed=createPagedFeed({field:"updatedAt",pageSize:30,
   subscribe:(next,error)=>onSnapshot(query(ref,orderBy("updatedAt","desc"),limit(30)),{includeMetadataChanges:true},next,error),
   fetchPage:cursor=>getDocsFromServer(query(ref,orderBy("updatedAt","desc"),startAfter(cursor),limit(30))),
   onChange:state=>{
    suite?.renderInbox(state.docs,{more:state.more,loading:state.loading,loadMore:()=>adminFeed.loadMore()});
   },onError:e=>{$("list").textContent="客戶列表讀取失敗："+chatError(e);}
  });
 }
 adminFeed.start();
}
async function openAdminHome(){
 $("adminNav").classList.remove("hidden");showAdminPage("adminHome");
 void syncPushToken(auth.currentUser,"admin");
 const target=new URLSearchParams(location.search).get("chat");
 if(target){history.replaceState(null,"",location.pathname);await openCustomerChat(target)}
}
navigator.serviceWorker?.addEventListener("message",async event=>{const m=event.data;if(m?.type!=="OPEN_NOTIFICATION_URL"||!m.url)return;try{const u=new URL(m.url);const target=u.searchParams.get("chat");if(target)await openCustomerChat(target)}catch(e){console.warn("notification route",e)}});onAuthStateChanged(auth,async user=>{
 if(suite?.demo)return;
 if(user?.uid!==ADMIN){adminFeed?.destroy();adminFeed=null;closeChatListener();}
 if(booted)return;
 booted=true;
 if(user?.uid===ADMIN){await openAdminHome();return}
 show("login");
});
$("go").onclick=async()=>{
 $("err").textContent="登入中…";
 try{
  await setPersistence(auth,browserLocalPersistence);
  const cred=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value);
  if(cred.user.uid!==ADMIN){await signOut(auth);throw Error("非管理員帳號")}
  localStorage.setItem("salonAdminLoggedIn","1");
  $("err").textContent="";
  await openAdminHome();
 }catch(e){$("err").textContent="登入失敗："+e.message}
};async function enableAdminNotify(){try{if(!auth.currentUser||auth.currentUser.uid!==ADMIN)throw Error("請先登入店家後台");if(!supportsPushAPIs())throw Error("此系統不支援背景通知；聊天仍可使用");const perm=await Notification.requestPermission();if(perm!=="granted")throw Error("尚未允許通知");const messaging=await getChatMessaging();if(!messaging)throw Error("此瀏覽器無法啟用通知；聊天仍可使用");const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});await savePushToken("pushTokens/"+ADMIN+"/devices/"+deviceId(),{token,uid:ADMIN,role:"admin",deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent});$("adminNotifyStatus").textContent="✅ 這台裝置已開啟店家通知";updateAdminNotifyUI(true);}catch(e){$("adminNotifyStatus").textContent="⚠️ 店家通知設定失敗："+e.message}}$("adminNotify").onclick=enableAdminNotify;$("replyBtn").onclick=()=>transmitChat(sel,$("reply").value,ADMIN,"admin",$("reply"),$("replyBtn"));$("back").onclick=()=>{
 const chat=$("adminChat");chat.classList.add("hidden");chat.style.display="none";
 ["admin","adminNav"].forEach(id=>{const el=$(id);if(el)el.style.display=""});
 showAdminPage("admin");
};

suite=installSuite({auth,db,role:CHAT_ROLE,delivery,getChat:()=>currentChatView,renderChat:renderChatView,openChat:openCustomerChat,showPage:showAdminPage,openTool});
</script></body></html>
