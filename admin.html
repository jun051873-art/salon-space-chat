<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="專屬空間"><meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest-admin.json"><link rel="apple-touch-icon" href="./apple-touch-icon.svg"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>專屬空間 店家版</title><style>body{margin:0;font-family:system-ui;background:#f5f1ea;color:#292722}.app{max-width:720px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}button,input{font:inherit}button{padding:14px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700;margin:5px}input{padding:14px;border:1px solid #ddd;border-radius:14px;width:calc(100% - 30px);margin:5px}.hidden{display:none}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:75%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}#msgs,#adminMsgs{height:48vh;overflow:auto}#adminChat{min-height:calc(100vh - 70px);margin:0;background:transparent;padding:8px 4px 110px}#adminChat #adminMsgs{height:62vh}#adminChat #back{margin:4px 0 14px}#setup,#chat{display:none!important}.shellPage{padding-bottom:88px}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,248,244,.96);backdrop-filter:blur(18px);border-top:1px solid #e4ddd4;z-index:50}.navBtn{flex:1;background:transparent;color:#716b63;padding:9px 2px;margin:0;border-radius:14px;font-size:11px;font-weight:700}.navBtn span{display:block;font-size:20px;margin-bottom:3px}.navBtn.active{background:#292722;color:#fff}.placeholder{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center}.placeholder h2{margin-bottom:8px}.placeholder p{color:#817b72;line-height:1.6}.app{padding-bottom:96px}
/* visual refinement */
:root{--ink:#292722;--muted:#8b857d;--paper:#f5f1ea;--line:#e9e3da;--glass:rgba(255,255,255,.82)}
#admin.card{padding:14px 12px 24px;background:rgba(255,255,255,.74);box-shadow:0 14px 40px rgba(70,58,42,.06)}
#admin h2{padding:8px 10px 14px;margin:0;font-size:28px}
#list>.customerRow{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer}
#list>.customerRow:last-child{border-bottom:0}.avatar{width:50px;height:50px;border-radius:18px;background:linear-gradient(145deg,#fff,#ebe5dc);display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:inset 0 0 0 1px #e8e1d8}
.customerMain{min-width:0}.customerName{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customerPreview{margin-top:4px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customerMeta{font-size:11px;color:#aaa49c;text-align:right}
.homeGroups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.groupCard{margin:0;padding:18px 14px;background:#f7f4ef;color:#292722;text-align:left;border-radius:20px;min-height:110px}.groupCard>b,.groupCard>small{display:block}.groupCard>b{font-size:17px;margin-top:12px}.groupCard>small{font-size:12px;color:#8b857d;margin-top:4px}.bottomNav{border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(70,58,42,.08)}
.navBtn span{width:28px;height:28px;margin:0 auto 4px;display:grid;place-items:center;border-radius:10px;font-size:17px;background:rgba(41,39,34,.06)}
.navBtn.active span{background:rgba(255,255,255,.15)}.navBtn{font-size:12px;letter-spacing:.02em}
</style></head><body><div id="bootSplash" style="position:fixed;inset:0;z-index:9999;background:#f5f1ea;display:flex;align-items:center;justify-content:center;font-family:system-ui;color:#292722"><div style="text-align:center"><div style="font-size:30px;font-weight:800">專屬空間 SALON</div><div style="margin-top:12px;font-size:15px;opacity:.55">店家管理</div></div></div><div class="app"><h1>專屬空間 SALON</h1><div id="home" class="hidden"></div><div id="setup" class="card hidden"><h2>第一次使用</h2><input id="name" placeholder="稱呼"><input id="phone" placeholder="手機號碼"><button id="start">開始使用</button></div><div id="chat" class="card hidden"><h2>與專屬空間聊天</h2><div id="msgs"></div><input id="text" placeholder="輸入訊息"><button id="send">傳送</button><p id="customerPushStatus"></p></div><div id="login" class="card hidden"><h2>店家登入</h2><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="密碼"><button id="go">登入</button><p id="err"></p></div><div id="adminHome" class="card hidden shellPage"><h2>主頁</h2><input id="homeSearch" placeholder="搜尋客人姓名／電話"><div class="homeGroups"><button class="groupCard" data-filter="birthday">🎂<b>本月壽星</b><small>生日客戶</small></button><button class="groupCard" data-filter="all">◎<b>全部客戶</b><small>所有已建檔客戶</small></button><button class="groupCard" data-filter="new">＋<b>新加入</b><small>最近建立</small></button><button class="groupCard" data-filter="blocked">⊘<b>封鎖</b><small>已封鎖客戶</small></button></div><p style="color:#8b857d">之後可在這裡新增／編輯自己的客戶分類與標籤。</p></div>
<div id="admin" class="card hidden shellPage"><h2>客戶訊息</h2><div id="adminNotifyBox" class="hidden"><button id="adminNotify">🔔 開啟店家通知</button><p id="adminNotifyStatus">這台裝置尚未完成通知設定。</p></div><div id="list">目前沒有客人</div></div><div id="adminBroadcast" class="card hidden shellPage placeholder"><div><h2>📣 群發</h2><p>群發訊息的操作區先放這裡。<br>之後再決定收件對象、預覽與發送流程。</p></div></div>
<div id="adminContent" class="card hidden shellPage placeholder"><div><h2>📋 內容</h2><p>公告、店休日、活動、作品與產品<br>之後統一從這裡管理。</p></div></div>
<div id="adminCustomers" class="card hidden shellPage placeholder"><div><h2>👥 客戶</h2><p>客戶搜尋、標籤、封鎖、封存與資料管理<br>之後放在這裡。</p></div></div>
<div id="adminSettings" class="card hidden shellPage placeholder"><div><h2>⚙️ 設定</h2><p>店家資訊、通知與系統設定<br>之後集中在這裡。</p></div></div>
<div id="adminChat" class="card hidden"><button id="back">← 客戶列表</button><h2 id="who">聊天室</h2><div id="adminMsgs"></div><input id="reply" placeholder="輸入回覆"><button id="replyBtn">傳送</button><p id="pushStatus"></p></div><nav id="adminNav" class="bottomNav hidden"><button class="navBtn active" data-admin-page="adminHome"><span>⌂</span>主頁</button><button class="navBtn" data-admin-page="admin"><span>◉</span>訊息</button><button class="navBtn" data-admin-page="adminBroadcast"><span>⌁</span>群發</button><button class="navBtn" data-admin-page="adminContent"><span>▤</span>內容</button><button class="navBtn" data-admin-page="adminSettings"><span>⌘</span>設定</button></nav></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import{getMessaging,getToken,onMessage}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js";const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"},ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);const messaging=getMessaging(app),VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";const MODE="admin";localStorage.setItem("salonMode","admin");let uid,sel,booted=false;
function deviceId(){let id=localStorage.getItem("salonDeviceId");if(!id){id=(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)));localStorage.setItem("salonDeviceId",id)}return id}
function deviceLabel(){const ua=navigator.userAgent;const platform=navigator.platform||"";if(/iPad/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))return"iPad";if(/iPhone/i.test(ua))return"iPhone";if(/Android/i.test(ua)&&!/Mobile/i.test(ua))return"Android Tablet";if(/Android/i.test(ua))return"Android Phone";if(/Mac/i.test(platform)||/Macintosh/i.test(ua))return"Mac";if(/Win/i.test(platform)||/Windows/i.test(ua))return"Windows";return"Other"}function show(x){["home","setup","chat","login","adminHome","admin","adminBroadcast","adminContent","adminCustomers","adminSettings","adminChat"].forEach(i=>{const el=$(i);if(el)el.classList.toggle("hidden",i!==x)});const s=document.getElementById("bootSplash");if(s)s.remove()}function listen(u,el,viewer){onSnapshot(query(collection(db,"chats",u,"messages"),orderBy("createdAt","asc")),s=>{el.innerHTML=s.docs.map(d=>{let m=d.data();return'<div class="msg '+(m.senderId===viewer?"mine":"")+'">'+(m.text||"")+"</div>"}).join("");el.scrollTop=el.scrollHeight})}async function send(u,t,sender,role){if(!t.trim())return;await addDoc(collection(db,"chats",u,"messages"),{text:t.trim(),senderId:sender,senderRole:role,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",u),{lastMessage:t.trim(),updatedAt:serverTimestamp()},{merge:true})}function updateAdminNotifyUI(ok=false){const b=$("adminNotifyBox");if(!b)return;if(ok&&Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPushToken(user,role){
 try{
  if(Notification.permission!=="granted"||!("serviceWorker" in navigator)){if(role==="admin")updateAdminNotifyUI(false);return;}
  const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(token){await setDoc(doc(db,"pushTokens",user.uid,"devices",deviceId()),{token,uid:user.uid,role,deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent,updatedAt:serverTimestamp()},{merge:true});if(role==="admin")updateAdminNotifyUI(true)}else if(role==="admin")updateAdminNotifyUI(false);
 }catch(e){console.warn("push sync",e);if(role==="admin")updateAdminNotifyUI(false)}
}
function showAdminPage(id){const pages=["adminHome","admin","adminBroadcast","adminContent","adminSettings"];if(!pages.includes(id))id="adminHome";show(id);$("adminNav")?.classList.remove("hidden");document.querySelectorAll("#adminNav [data-admin-page]").forEach(b=>b.classList.toggle("active",b.dataset.adminPage===id))}
$("adminNav")?.addEventListener("click",e=>{const b=e.target.closest("#adminNav [data-admin-page]");if(!b)return;e.preventDefault();e.stopPropagation();showAdminPage(b.dataset.adminPage)});
async function openCustomerChat(uidToOpen){
 sel=uidToOpen;
 $("adminNav")?.classList.add("hidden");
 const u=await getDoc(doc(db,"users",sel));
 $("who").textContent=u.data()?.name||"客人";
 ["home","setup","chat","login","adminHome","admin","adminBroadcast","adminContent","adminCustomers","adminSettings"].forEach(id=>$(id)?.classList.add("hidden"));
 $("adminChat").classList.remove("hidden");
 listen(sel,$("adminMsgs"),ADMIN);
}
async function openAdminHome(){
 $("adminNav").classList.remove("hidden");showAdminPage("adminHome");
 onSnapshot(query(collection(db,"chats"),orderBy("updatedAt","desc")),s=>{
  $("list").innerHTML=s.docs.map(d=>{const x=d.data();const n=x.name||"客人";const initial=n.trim().slice(0,1)||"客";return '<div class="customerRow" data-u="'+d.id+'"><div class="avatar">'+initial+'</div><div class="customerMain"><div class="customerName">'+n+'</div><div class="customerPreview">'+(x.lastMessage||"尚無訊息")+'</div></div><div class="customerMeta">›</div></div>'}).join("")||"目前沒有客人";
  document.querySelectorAll("#list .customerRow").forEach(row=>{row.addEventListener("click",async ev=>{ev.preventDefault();ev.stopImmediatePropagation();await openCustomerChat(row.getAttribute("data-u"))},{once:false})})
 });
 await syncPushToken(auth.currentUser,"admin");
 const target=new URLSearchParams(location.search).get("chat");
 if(target){history.replaceState(null,"",location.pathname);await openCustomerChat(target)}
}
navigator.serviceWorker?.addEventListener("message",async event=>{const m=event.data;if(m?.type!=="OPEN_NOTIFICATION_URL"||!m.url)return;try{const u=new URL(m.url);const target=u.searchParams.get("chat");if(target)await openCustomerChat(target)}catch(e){console.warn("notification route",e)}});onAuthStateChanged(auth,async user=>{
 if(booted)return;
 booted=true;
 if(user?.uid===ADMIN){await openAdminHome();return}
 show("login");
});
$("go").onclick=async()=>{
 $("err").textContent="登入中…";
 try{
  await setPersistence(auth,browserLocalPersistence);
  const cred=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value);
  if(cred.user.uid!==ADMIN){await signOut(auth);throw Error("非管理員帳號")}
  localStorage.setItem("salonAdminLoggedIn","1");
  $("err").textContent="";
  await openAdminHome();
 }catch(e){$("err").textContent="登入失敗："+e.message}
};async function enableAdminNotify(){try{if(!auth.currentUser||auth.currentUser.uid!==ADMIN)throw Error("請先登入店家後台");if(!("serviceWorker" in navigator))throw Error("此瀏覽器不支援背景通知");const perm=await Notification.requestPermission();if(perm!=="granted")throw Error("尚未允許通知");const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});await setDoc(doc(db,"pushTokens",ADMIN,"devices",deviceId()),{token,uid:ADMIN,role:"admin",deviceId:deviceId(),deviceType:deviceLabel(),userAgent:navigator.userAgent,updatedAt:serverTimestamp()},{merge:true});$("adminNotifyStatus").textContent="✅ 這台裝置已開啟店家通知";updateAdminNotifyUI(true);}catch(e){$("adminNotifyStatus").textContent="⚠️ 店家通知設定失敗："+e.message}}$("adminNotify").onclick=enableAdminNotify;$("replyBtn").onclick=async()=>{let t=$("reply").value;$("reply").value="";$("pushStatus").textContent="";if(!t.trim())return;await send(sel,t,ADMIN,"admin");try{const p=await getDoc(doc(db,"pushTokens",sel));const token=p.data()?.token;if(!token)throw new Error("找不到這位客人的通知 Token，請客人在同一身分下重新按一次「開啟訊息通知」");const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,title:"專屬空間 SALON",body:t.trim(),url:"https://jun051873-art.github.io/salon-space-chat/customer.html"})});const out=await r.json();if(!r.ok||!out.ok)throw new Error(JSON.stringify(out));$("pushStatus").textContent="✅ 通知已送交 FCM";}catch(e){$("pushStatus").textContent="⚠️ 通知失敗："+e.message;console.error("push failed",e)}};$("back").onclick=()=>{showAdminPage("admin");$("adminNav")?.classList.remove("hidden")};</script></body></html>
