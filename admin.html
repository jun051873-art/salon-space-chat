<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="專屬空間"><meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest-admin.json"><link rel="apple-touch-icon" href="./apple-touch-icon.svg"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>專屬空間 店家版</title><style>body{margin:0;font-family:system-ui;background:#f5f1ea;color:#292722}.app{max-width:720px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}button,input{font:inherit}button{padding:14px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700;margin:5px}input{padding:14px;border:1px solid #ddd;border-radius:14px;width:calc(100% - 30px);margin:5px}.hidden{display:none}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:75%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}#msgs,#adminMsgs{height:48vh;overflow:auto}#setup,#chat{display:none!important}</style></head><body><div id="bootSplash" style="position:fixed;inset:0;z-index:9999;background:#f5f1ea;display:flex;align-items:center;justify-content:center;font-family:system-ui;color:#292722"><div style="text-align:center"><div style="font-size:30px;font-weight:800">專屬空間 SALON</div><div style="margin-top:12px;font-size:15px;opacity:.55">店家管理</div></div></div><div class="app"><h1>專屬空間 SALON</h1><div id="home" class="hidden"></div><div id="setup" class="card hidden"><h2>第一次使用</h2><input id="name" placeholder="稱呼"><input id="phone" placeholder="手機號碼"><button id="start">開始使用</button></div><div id="chat" class="card hidden"><h2>與專屬空間聊天</h2><div id="msgs"></div><input id="text" placeholder="輸入訊息"><button id="send">傳送</button><p id="customerPushStatus"></p></div><div id="login" class="card hidden"><h2>店家登入</h2><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="密碼"><button id="go">登入</button><p id="err"></p></div><div id="admin" class="card hidden"><h2>客戶訊息</h2><button id="adminNotify">🔔 開啟店家通知</button><p id="adminNotifyStatus"></p><div id="list">目前沒有客人</div></div><div id="adminChat" class="card hidden"><button id="back">← 客戶列表</button><h2 id="who">聊天室</h2><div id="adminMsgs"></div><input id="reply" placeholder="輸入回覆"><button id="replyBtn">傳送</button><p id="pushStatus"></p></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import{getMessaging,getToken,onMessage}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js";const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"},ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);const messaging=getMessaging(app),VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";const MODE="admin";localStorage.setItem("salonMode","admin");let uid,sel,booted=false;function show(x){["home","setup","chat","login","admin","adminChat"].forEach(i=>$(i).classList.toggle("hidden",i!==x));const s=document.getElementById("bootSplash");if(s)s.remove()}function listen(u,el,viewer){onSnapshot(query(collection(db,"chats",u,"messages"),orderBy("createdAt","asc")),s=>{el.innerHTML=s.docs.map(d=>{let m=d.data();return'<div class="msg '+(m.senderId===viewer?"mine":"")+'">'+(m.text||"")+"</div>"}).join("");el.scrollTop=el.scrollHeight})}async function send(u,t,sender,role){if(!t.trim())return;await addDoc(collection(db,"chats",u,"messages"),{text:t.trim(),senderId:sender,senderRole:role,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",u),{lastMessage:t.trim(),updatedAt:serverTimestamp()},{merge:true})}async function syncPushToken(user,role){
 try{
  if(Notification.permission!=="granted"||!("serviceWorker" in navigator))return;
  const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(token)await setDoc(doc(db,"pushTokens",user.uid),{token,uid:user.uid,role,updatedAt:serverTimestamp()},{merge:true});
 }catch(e){console.warn("push sync",e)}
}
async function openAdminHome(){
 show("admin");
 onSnapshot(query(collection(db,"chats"),orderBy("updatedAt","desc")),s=>{
  $("list").innerHTML=s.docs.map(d=>'<div class="card" data-u="'+d.id+'"><b>'+(d.data().name||"客人")+"</b><br>"+(d.data().lastMessage||"尚無訊息")+"</div>").join("")||"目前沒有客人";
  document.querySelectorAll("[data-u]").forEach(e=>e.onclick=async()=>{sel=e.dataset.u;let u=await getDoc(doc(db,"users",sel));$("who").textContent=u.data()?.name||"客人";show("adminChat");listen(sel,$("adminMsgs"),ADMIN)})
 });
 await syncPushToken(auth.currentUser,"admin");
}
onAuthStateChanged(auth,async user=>{
 if(booted)return;
 booted=true;
 if(user?.uid===ADMIN){await openAdminHome();return}
 show("login");
});
$("go").onclick=async()=>{
 $("err").textContent="登入中…";
 try{
  await setPersistence(auth,browserLocalPersistence);
  const cred=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value);
  if(cred.user.uid!==ADMIN){await signOut(auth);throw Error("非管理員帳號")}
  localStorage.setItem("salonAdminLoggedIn","1");
  $("err").textContent="";
  await openAdminHome();
 }catch(e){$("err").textContent="登入失敗："+e.message}
};async function enableAdminNotify(){try{if(!auth.currentUser||auth.currentUser.uid!==ADMIN)throw Error("請先登入店家後台");if(!("serviceWorker" in navigator))throw Error("此瀏覽器不支援背景通知");const perm=await Notification.requestPermission();if(perm!=="granted")throw Error("尚未允許通知");const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});await setDoc(doc(db,"pushTokens",ADMIN),{token,uid:ADMIN,role:"admin",updatedAt:serverTimestamp()},{merge:true});$("adminNotifyStatus").textContent="✅ 這台 iPhone 已開啟店家通知";}catch(e){$("adminNotifyStatus").textContent="⚠️ 店家通知設定失敗："+e.message}}$("adminNotify").onclick=enableAdminNotify;$("replyBtn").onclick=async()=>{let t=$("reply").value;$("reply").value="";$("pushStatus").textContent="";if(!t.trim())return;await send(sel,t,ADMIN,"admin");try{const p=await getDoc(doc(db,"pushTokens",sel));const token=p.data()?.token;if(!token)throw new Error("找不到這位客人的通知 Token，請客人在同一身分下重新按一次「開啟訊息通知」");const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,title:"專屬空間 SALON",body:t.trim()})});const out=await r.json();if(!r.ok||!out.ok)throw new Error(JSON.stringify(out));$("pushStatus").textContent="✅ 通知已送交 FCM";}catch(e){$("pushStatus").textContent="⚠️ 通知失敗："+e.message;console.error("push failed",e)}};$("back").onclick=()=>show("admin");</script></body></html>
