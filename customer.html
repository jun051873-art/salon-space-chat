<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest-customer.json">
<title>專屬空間</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1ea;color:#292722}
.app{max-width:720px;margin:auto;min-height:100vh;padding:20px}.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:99;background:#f5f1ea;display:flex;align-items:center;justify-content:center;text-align:center}
.logo{font-size:30px;font-weight:800}.sub{margin-top:10px;opacity:.55}
.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}h1{font-size:25px}
input,button{font:inherit}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;margin:6px 0}
button{padding:14px 18px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700}
#msgs{height:58vh;overflow:auto;padding:8px}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:78%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}
.composer{display:flex;gap:8px}.composer input{flex:1}.status{font-size:12px;opacity:.7;margin-top:8px}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:flex;gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(250,248,244,.96);backdrop-filter:blur(18px);border-top:1px solid #e4ddd4;z-index:50}.navBtn{flex:1;background:transparent;color:#716b63;padding:10px 4px;margin:0;border-radius:15px;font-size:12px}.navBtn span{display:block;font-size:22px;margin-bottom:3px}.navBtn.active{background:#292722;color:#fff}.placeholder{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center}.placeholder p{color:#817b72;line-height:1.7}.app{padding-bottom:100px}
/* visual refinement */
:root{--ink:#292722;--muted:#8b857d;--line:#e9e3da}
#chat>.card{background:rgba(255,255,255,.78);box-shadow:0 14px 40px rgba(70,58,42,.06)}
#msgs{padding:10px 2px 18px}.msg{max-width:76%;padding:11px 14px;margin:9px 0;border-radius:18px 18px 18px 6px;background:#fff;box-shadow:0 5px 18px rgba(70,58,42,.06);line-height:1.45}.msg.mine{margin-left:auto;border-radius:18px 18px 6px 18px;background:#292722;color:#fff}
.bottomNav{border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(70,58,42,.08)}.navBtn span{width:30px;height:30px;margin:0 auto 4px;display:grid;place-items:center;border-radius:10px;font-size:17px;background:rgba(41,39,34,.06)}.navBtn.active span{background:rgba(255,255,255,.15)}
.quickPills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.quickPills button{flex:0 0 auto;background:#eee9e2;color:#292722;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:650}.quickPills::-webkit-scrollbar{display:none}</style></head>
<body>
<div id="splash"><div><div class="logo">專屬空間 SALON</div><div class="sub">連線中…</div></div></div>
<div class="app">
<h1>專屬空間 SALON</h1>
<section id="setup" class="card hidden">
<h2>第一次使用</h2>
<p>留下稱呼與手機，之後這台裝置會直接進入聊天室。</p>
<input id="name" placeholder="稱呼，例如：王小姐">
<input id="phone" placeholder="手機號碼"><div style="display:flex;gap:8px"><input id="birthMonth" inputmode="numeric" placeholder="生日月份，例如 5"><input id="birthDay" inputmode="numeric" placeholder="日期，例如 18"></div><p class="status">只需要月／日，不需要出生年份。</p>
<button id="start">開始使用</button>
<p id="setupErr" class="status"></p>
</section>
<section id="chat" class="hidden">
<div class="card"><h2>與專屬空間聊天</h2><div id="msgs"></div>
<div class="quickPills"><button data-quick="價目表">價目表</button><button data-quick="預約">預約</button><button data-quick="營業時間">營業時間</button></div><div class="composer"><input id="text" placeholder="輸入訊息…"><button id="send">傳送</button></div>
<div id="notifyBox" class="hidden" style="margin-top:14px"><button id="enableNotify">🔔 開啟訊息通知</button><p id="notifyStatus" class="status">開啟後，店家回覆時手機會提醒你。</p></div><p id="pushStatus" class="status"></p><p id="pushDiag" class="status"></p></div>
</section>
<section id="info" class="card hidden placeholder"><div><h2>🏠 SALON 資訊</h2><p>公告、休假日、活動與店家資訊<br>之後會顯示在這裡。</p></div></section>
<section id="gallery" class="card hidden placeholder"><div><h2>🖼 作品・產品</h2><p>作品照片、產品介紹與連結<br>之後會顯示在這裡。</p></div></section>
<nav id="customerNav" class="bottomNav hidden"><button class="navBtn active" data-customer-page="chat"><span>◉</span>聊天</button><button class="navBtn" data-customer-page="info"><span>⌂</span>SALON 資訊</button><button class="navBtn" data-customer-page="gallery"><span>▧</span>作品・產品</button></nav>
</div>
<script type="module">import{createDelivery}from"./chat-delivery.js?v=D3.2";const CHAT_ROLE="customer";
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,writeBatch}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import{getMessaging,getToken,isSupported}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js";
const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"};
const ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let uid,unsub,started=false;
/* CHAT-DIAG-01: report server acknowledgement separately from local echo. */
let activeChatUnsubscribe=null, activeReadTimer=null;
function chatError(e){
 const code=e?.code||"unknown";
 const labels={"permission-denied":"雲端權限拒絕","unavailable":"雲端暫時無法連線","unauthenticated":"登入已失效","resource-exhausted":"雲端用量限制"};
 return (labels[code]||"操作失敗")+" ("+code+")："+(e?.message||String(e));
}
function ensureChatStatus(room){
 let box=$("chatStatus");
 if(!box){
  box=document.createElement("div");box.id="chatStatus";
  box.style.cssText="grid-column:1/-1;flex-basis:100%;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;padding:5px 0;color:#62584c";
  box.innerHTML='<div id="chatRead" role="status"></div><div id="chatWrite" role="status"></div><details><summary>連線檢查 D3.2</summary><div id="chatIdentity"></div></details>';
  const composer=document.querySelector("#adminChat .composer");
  if(composer)composer.appendChild(box);else $("msgs").after(box);
 }
 $("chatIdentity").textContent="專案：salon-space-chat｜登入："+(auth.currentUser?.uid||"未登入")+"｜聊天室："+room;
 box.dataset.room=room;
 return box;
}
function safeChatText(t){return String(t??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
let currentChatView=null;
const delivery=createDelivery({auth,projectId:cfg.projectId,role:CHAT_ROLE,notify:notifyDelivery,onChange:()=>{if(currentChatView)renderChatView();}});
async function savePushToken(path,values){
 try{const old=await delivery.api("/"+path);if(Object.entries(values).every(([k,v])=>old.fields?.[k]?.stringValue===String(v)))return;}catch(e){if(e.status!==404)throw e;}

 const fields=Object.fromEntries(Object.entries(values).map(([k,v])=>[k,{stringValue:String(v)}]));
 await delivery.api(":commit",{method:"POST",body:JSON.stringify({writes:[{update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/"+path,fields},updateMask:{fieldPaths:Object.keys(fields)},updateTransforms:[{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]}]})});
}
async function pushRequest(body){
 const idToken=await auth.currentUser?.getIdToken();if(!idToken)throw Error("請重新登入後再傳送通知");
 body={...body,idToken};
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
 try{
  const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
  const out=await r.json();
  if(!r.ok||!out.ok||(out.success!==undefined&&Number(out.success)<1))throw Error("通知服務未確認送出："+JSON.stringify(out));
  return out;
 }finally{clearTimeout(timer);}
}
async function notifyDelivery(e){
 // Worker v4 resolves recipient devices; avoid an extra client-side token read.
 await pushRequest({target:e.role==="customer"?"admin":"customer",customerUid:e.room,messageId:e.id});
}
function renderChatView(){
 const v=currentChatView;if(!v)return;
 const own=delivery.entries().filter(e=>e.room===v.room);
 const ids=new Set(v.docs.map(d=>d.id));
 const rows=v.docs.map(d=>({text:d.data().text,senderId:d.data().senderId,pending:d.metadata.hasPendingWrites}));
 for(const e of own)if(!ids.has(e.id))rows.push({text:e.text,senderId:e.senderId,pending:e.stage==="queued"});
 v.el.innerHTML=rows.map(m=>'<div class="msg '+(m.senderId===v.viewer?"mine":"")+'">'+safeChatText(m.text)+'<small style="display:block;font-size:11px;opacity:.75;margin-top:5px">'+(m.pending?"已保存在此裝置，等待送達雲端":m.senderId===v.viewer?"已存入雲端":"")+'</small></div>').join("");
 v.el.scrollTop=v.el.scrollHeight;
 const waiting=own.filter(e=>e.stage==="queued"),push=own.filter(e=>e.stage==="stored"||e.stage==="notify-error");
 $("chatWrite").textContent=waiting.length?waiting.length+" 則待傳，已保存在此裝置；重新開啟後會接續傳送。"+(waiting.find(e=>e.error)?.error?"\n原因："+waiting.find(e=>e.error).error:""):"";
 $("pushStatus").textContent=push.length?"訊息已存入雲端；通知尚未完成。"+(push.find(e=>e.error)?.error?"\n"+push.find(e=>e.error).error:""):"";
}
function watchChat(room,el,viewer){
 activeChatUnsubscribe?.();clearTimeout(activeReadTimer);
 ensureChatStatus(room);$("chatRead").textContent="正在連接雲端訊息…";
 currentChatView={room,el,viewer,docs:[]};renderChatView();delivery.resume();
 let confirmed=false;
 activeReadTimer=setTimeout(()=>{if(!confirmed)$("chatRead").textContent="尚未取得雲端回應，正在等待重新連線。"},12000);
 activeChatUnsubscribe=onSnapshot(query(collection(db,"chats",room,"messages"),orderBy("createdAt","asc")),{includeMetadataChanges:true},s=>{
  if(currentChatView?.room!==room)return;
  confirmed=!s.metadata.fromCache;if(confirmed)clearTimeout(activeReadTimer);
  $("chatRead").textContent=confirmed?"已取得雲端訊息":"目前顯示本機資料，等待雲端確認…";
  currentChatView.docs=s.docs;
  if(confirmed)delivery.acknowledge(s.docs.filter(d=>!d.metadata.hasPendingWrites).map(d=>d.id));
  renderChatView();
 },e=>{clearTimeout(activeReadTimer);$("chatRead").textContent="讀取失敗："+chatError(e);});
}
function transmitChat(room,t,sender,role,input,button){
 if(!t.trim())return;
 ensureChatStatus(room);
 try{delivery.enqueue({room,text:t,senderId:sender});input.value="";button.disabled=false;input.disabled=false;}
 catch(e){$("chatWrite").textContent="尚未送出，原文仍在輸入框："+e.message;}
}
window.addEventListener("online",()=>delivery.resume());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")delivery.resume();});
onAuthStateChanged(auth,()=>delivery.resume());

let messaging=null, messagingPromise=null;
function supportsPushAPIs(){return "Notification" in window && "PushManager" in window && "serviceWorker" in navigator;}
async function getChatMessaging(){
 if(!supportsPushAPIs())return null;
 if(!messagingPromise)messagingPromise=(async()=>{
  try{if(!await isSupported())return null;messaging=getMessaging(app);return messaging;}
  catch(e){console.warn("通知功能無法啟用；聊天仍可使用",e);return null;}
 })();
 return messagingPromise;
}

function show(id){["setup","chat","info","gallery"].forEach(x=>$(x)?.classList.add("hidden"));$(id)?.classList.remove("hidden");$("splash")?.remove();if(id!=="setup")$("customerNav")?.classList.remove("hidden")}
function showCustomerPage(id){show(id);document.querySelectorAll("[data-customer-page]").forEach(b=>b.classList.toggle("active",b.dataset.customerPage===id))}
document.querySelectorAll("[data-customer-page]").forEach(b=>b.onclick=()=>showCustomerPage(b.dataset.customerPage));
function listen(){watchChat(uid,$("msgs"),uid)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateNotifyUI(){const b=$("notifyBox");if(!b)return;if(!supportsPushAPIs()||Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPush(){
 try{
  if(!supportsPushAPIs()||Notification.permission!=="granted"){updateNotifyUI();return false;}
  const messaging=await getChatMessaging();if(!messaging)throw Error("此裝置無法啟用背景通知");
  const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js",{updateViaCache:"none"});await reg.update();await navigator.serviceWorker.ready;
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!token)throw Error("未取得通知識別碼");
  await savePushToken("pushTokens/"+uid,{token,uid,role:"customer"});
  $("notifyBox").classList.add("hidden");return true;
 }catch(e){$("notifyStatus").textContent="通知尚未設定完成："+e.message;$("notifyBox").classList.remove("hidden");return false;}
}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
onAuthStateChanged(auth,async user=>{if(started)return;started=true;try{if(user?.uid===ADMIN){await signOut(auth);user=null}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;const p=await getDoc(doc(db,"users",uid));if(p.exists()){show("chat");listen();syncPush()}else show("setup")}catch(e){$("splash").querySelector(".sub").textContent="連線失敗，請重新整理"}});
$("enableNotify").onclick=async()=>{try{if(!uid)throw Error("客人身分尚未完成");if(!("Notification"in window))throw Error("此裝置不支援通知");const p=await Notification.requestPermission();if(p!=="granted")throw Error("尚未允許通知");$("notifyStatus").textContent="正在設定通知…";if(!await syncPush())return;$("notifyStatus").textContent="✅ 訊息通知已開啟";$("notifyBox").classList.add("hidden")}catch(e){$("notifyStatus").textContent="通知設定失敗："+e.message}};$("start").onclick=async()=>{try{const name=$("name").value.trim(),phone=$("phone").value.trim(),birthMonth=Number($("birthMonth").value),birthDay=Number($("birthDay").value);if(!name||!phone||!birthMonth||!birthDay)throw Error("請填寫稱呼、手機與生日月日");if(birthMonth<1||birthMonth>12||birthDay<1||birthDay>31)throw Error("請確認生日月日");await delivery.api(":commit",{method:"POST",body:JSON.stringify({writes:[
 {update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/users/"+uid,fields:{name:{stringValue:name},phone:{stringValue:phone},birthMonth:{integerValue:String(birthMonth)},birthDay:{integerValue:String(birthDay)},role:{stringValue:"customer"}}},updateMask:{fieldPaths:["name","phone","birthMonth","birthDay","role"]},updateTransforms:[{fieldPath:"createdAt",setToServerValue:"REQUEST_TIME"},{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]},
 {update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/chats/"+uid,fields:{userId:{stringValue:uid},name:{stringValue:name},phone:{stringValue:phone}}},updateMask:{fieldPaths:["userId","name","phone"]},updateTransforms:[{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]}
 ]})});show("chat");listen();syncPush()}catch(e){$("setupErr").textContent=e.message}};
async function readPushDiag(){try{const r=await caches.match("/salon-space-chat/__push_diag__");if(!r){$("pushDiag").textContent="推播診斷：尚未收到背景推播";return}const d=await r.json();$("pushDiag").textContent="推播診斷："+d.stage+"｜"+new Date(d.at).toLocaleString()}catch(e){$("pushDiag").textContent="推播診斷讀取失敗"}}setTimeout(readPushDiag,1200);document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{$("text").value=b.dataset.quick;$("send").click()});$("send").onclick=()=>transmitChat(uid,$("text").value,uid,"customer",$("text"),$("send"));
</script></body></html>
