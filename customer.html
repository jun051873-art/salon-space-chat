<script type="module" src="./salon-layout.js?v=C17"></script><script type="module">import{installSuite,messageHTML}from"./salon-suite.js?v=C25";let suite;let profileReady=false;let accountStatus="new";import{createDelivery}from"./chat-delivery.js?v=C14";import{createPagedFeed}from"./chat-feed.js?v=D4";const CHAT_ROLE="customer";

const ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let uid,unsub,started=false;
/* CHAT-DIAG-01: report server acknowledgement separately from local echo. */
let activeChatUnsubscribe=null, activeReadTimer=null;
function chatError(e){
 const code=e?.code||"unknown";
 const labels={"permission-denied":"雲端權限拒絕","unavailable":"雲端暫時無法連線","unauthenticated":"登入已失效","resource-exhausted":"雲端用量限制"};
 return (labels[code]||"操作失敗")+" ("+code+")："+(e?.message||String(e));
}
function ensureChatStatus(room){
 let box=$("chatStatus");
 if(!box){
  box=document.createElement("div");box.id="chatStatus";
  box.style.cssText="grid-column:1/-1;flex-basis:100%;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;padding:5px 0;color:#62584c";
  box.innerHTML='<div id="chatRead" role="status"></div><div id="chatWrite" role="status"></div><details><summary>連線檢查 S5</summary><div id="chatIdentity"></div></details>';
  const composer=document.querySelector("#adminChat .composer");
  if(composer)composer.appendChild(box);else $("chatDetails").prepend(box);
 }
 if($("chatWrite").parentElement!==document.querySelector(".conversationFooter"))document.querySelector(".conversationFooter").prepend($("chatWrite"));
 $("chatIdentity").textContent="專案：salon-space-chat｜登入："+(auth.currentUser?.uid||"未登入")+"｜聊天室："+room;
 box.dataset.room=room;

}
function safeChatText(t){return String(t??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
let currentChatView=null;
const delivery=createDelivery({auth,projectId:cfg.projectId,role:CHAT_ROLE,notify:notifyDelivery,onChange:()=>{if(currentChatView)renderChatView();}});
const tokenSaves=new Map();
function savePushToken(path,values){
 const key=auth.currentUser?.uid+":"+path+":"+JSON.stringify(values);
 if(tokenSaves.has(key))return tokenSaves.get(key);
 const task=writePushToken(path,values).catch(e=>{tokenSaves.delete(key);throw e;});
 tokenSaves.set(key,task);return task;
}
async function writePushToken(path,values){
 try{const old=await delivery.api("/"+path);if(Object.entries(values).every(([k,v])=>old.fields?.[k]?.stringValue===String(v)))return;}catch(e){if(e.status!==404)throw e;}

 const fields=Object.fromEntries(Object.entries(values).map(([k,v])=>[k,{stringValue:String(v)}]));
 await delivery.api(":commit",{method:"POST",body:JSON.stringify({writes:[{update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/"+path,fields},updateMask:{fieldPaths:Object.keys(fields)},updateTransforms:[{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]}]})});
}
async function pushRequest(body){
 const idToken=await auth.currentUser?.getIdToken();if(!idToken)throw Error("請重新登入後再傳送通知");
 body={...body,idToken};
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
 try{
  const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
  const out=await r.json();
  if(!r.ok||!out.ok||(out.success!==undefined&&Number(out.success)<1))throw Error("通知服務未確認送出："+JSON.stringify(out));
  return out;
 }finally{clearTimeout(timer);}
}
async function notifyDelivery(e){
 // Worker v4 resolves recipient devices; avoid an extra client-side token read.
 await pushRequest({target:e.role==="customer"?"admin":"customer",customerUid:e.room,messageId:e.id});
}
function renderChatView(reason="update"){
 const v=currentChatView;if(!v)return;
 const previousTop=v.el.scrollTop,previousHeight=v.el.scrollHeight;
 const followBottom=v.first||previousHeight-previousTop-v.el.clientHeight<100;
 const own=delivery.entries().filter(e=>e.room===v.room);
 const ids=new Set(v.docs.map(d=>d.id));
 const rows=v.docs.map(d=>({id:d.id,...d.data(),pending:d.metadata.hasPendingWrites||own.some(e=>e.id===d.id&&e.stage==="queued")}));
 for(const e of own)if(!ids.has(e.id))rows.push({id:e.id,text:e.text,senderId:e.senderId,pending:e.stage==="queued",attachment:e.attachment,sticker:e.sticker});
 const moreHtml=v.more?'<button type="button" data-older '+(v.loading?'disabled':'')+' style="display:block;margin:8px auto;background:#eae4db;color:#292722;padding:9px 16px;font-size:13px">'+(v.loading?'載入中…':'查看較早訊息')+'</button>':'';
 v.el.innerHTML=moreHtml+rows.map(m=>messageHTML(m,v.viewer,v.peerRead||0,v.person||{})).join("");
 v.el.querySelector('[data-older]')?.addEventListener('click',()=>v.feed.loadMore());
 if(reason==="older")v.el.scrollTop=previousTop+(v.el.scrollHeight-previousHeight);
 else if(followBottom)v.el.scrollTop=v.el.scrollHeight;
 else v.el.scrollTop=previousTop;
 if(v.docs.length)v.first=false;
 suite?.bindChat();
 const waiting=own.filter(e=>e.stage==="queued"),push=own.filter(e=>e.stage==="stored"||e.stage==="notify-error");
 $("chatWrite").textContent=waiting.length?waiting.length+" 則待傳，已保存在此裝置；重新開啟後會接續傳送。"+(waiting.find(e=>e.error)?.error?"\n原因："+waiting.find(e=>e.error).error:""):"";
 $("pushStatus").textContent=push.length?"訊息已存入雲端；通知尚未完成。"+(push.find(e=>e.error)?.error?"\n"+push.find(e=>e.error).error:""):"";
}
function watchChat(room,el,viewer){
 if(currentChatView?.room===room){currentChatView.feed.start();suite?.attachChat(currentChatView);return;}
 activeChatUnsubscribe?.();clearTimeout(activeReadTimer);
 ensureChatStatus(room);$("chatRead").textContent="正在連接雲端訊息…";
 const v={room,el,viewer,docs:[],more:false,loading:false,first:true};currentChatView=v;
 const ref=collection(db,"chats",room,"messages");
 const feed=createPagedFeed({field:"createdAt",pageSize:30,
  subscribe:(next,error)=>onSnapshot(query(ref,orderBy("createdAt","desc"),limit(30)),{includeMetadataChanges:true},next,error),
  fetchPage:cursor=>getDocsFromServer(query(ref,orderBy("createdAt","desc"),startAfter(cursor),limit(30))),
  onChange:state=>{
   if(currentChatView!==v)return;
   v.docs=state.docs.slice().reverse();v.more=state.more;v.loading=state.loading;
   if(state.reason==="live"||state.reason==="reset"){clearTimeout(activeReadTimer);$("chatRead").textContent="已取得雲端訊息";}
   if(state.reason==="cache")$("chatRead").textContent="目前顯示本機資料，等待雲端確認…";
   if(!state.fromCache&&state.ready)delivery.acknowledge(state.docs.filter(d=>!d.metadata.hasPendingWrites).map(d=>d.id));
   renderChatView(state.reason);
  },onError:e=>{if(currentChatView===v){clearTimeout(activeReadTimer);$("chatRead").textContent="讀取失敗："+chatError(e);}}
 });
 v.feed=feed;activeChatUnsubscribe=()=>feed.destroy();renderChatView();delivery.resume();
 activeReadTimer=setTimeout(()=>{if(currentChatView===v)$("chatRead").textContent="尚未取得雲端回應，正在等待重新連線。"},12000);
 feed.start();suite?.attachChat(v);
}
function transmitChat(room,t,sender,role,input,button){
 if(!t.trim())return;

 try{delivery.enqueue({room,text:t,senderId:sender});input.value="";button.disabled=false;input.disabled=false;}

}

function pauseAdminListIfPresent(){}

document.addEventListener("visibilitychange",()=>{

});
onAuthStateChanged(auth,()=>{if(profileReady)delivery.resume();});

let messaging=null, messagingPromise=null;
function supportsPushAPIs(){return "Notification" in window && "PushManager" in window && "serviceWorker" in navigator;}
async function getChatMessaging(){
 if(!supportsPushAPIs())return null;
 if(!messagingPromise)messagingPromise=(async()=>{
  try{if(!await isSupported())return null;messaging=getMessaging(app);return messaging;}
  catch(e){console.warn("通知功能無法啟用；聊天仍可使用",e);return null;}
 })();
 return messagingPromise;
}

function showCustomerPage(id){if(!profileReady&&id!=="setup")id="setup";if(["inbox","chat"].includes(id))delete document.body.dataset.returnToChat;else if(document.body.dataset.page==="chat")document.body.dataset.returnToChat="true";show(id);document.querySelector(".app").scrollTop=0;document.body.dataset.page=id;document.body.classList.toggle("detailOpen",["info","profile","preferences","featureDetail"].includes(id));document.body.classList.toggle("conversationOpen",id==="chat");document.documentElement.classList.toggle("conversationOpen",id==="chat");if(id==="chat"){if(uid)listen();}else{currentChatView?.feed.pause();suite?.stopReceipt();}suite?.page(id);document.querySelectorAll("[data-customer-page]").forEach(b=>b.classList.toggle("active",b.dataset.customerPage===(id==="chat"?"inbox":id)))}
document.querySelectorAll("[data-customer-page]").forEach(b=>b.onclick=()=>showCustomerPage(b.dataset.customerPage));

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateNotifyUI(){const b=$("notifyBox");if(!b)return;if(!supportsPushAPIs()||Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPush(){
 try{
  if(!supportsPushAPIs()||Notification.permission!=="granted"){updateNotifyUI();return false;}
  const messaging=await getChatMessaging();if(!messaging)throw Error("此裝置無法啟用背景通知");
  const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js",{updateViaCache:"none"});await reg.update();await navigator.serviceWorker.ready;
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!token)throw Error("未取得通知識別碼");
  await savePushToken("pushTokens/"+uid,{token,uid,role:"customer"});
  $("notifyBox").classList.add("hidden");return true;
 }catch(e){$("notifyStatus").textContent="通知尚未設定完成："+e.message;$("notifyBox").classList.remove("hidden");return false;}
}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
function applyAccess(data){accountStatus=data.status||'active';profileReady=accountStatus==='active';if(profileReady){showCustomerPage(location.hash==='#chat'?'chat':'inbox');delivery.resume();syncPush();suite?.authReady(auth.currentUser,data);}else{currentChatView?.feed.pause();suite?.stopReceipt();showCustomerPage('setup');$('customerNav').classList.add('hidden');$('setup').innerHTML='<h2>'+ (accountStatus==='pending'?'等待店家核准':'目前無法使用')+'</h2><p>'+(accountStatus==='pending'?'申請已送出，店家核准後請按下方按鈕。':'此帳號已停用，請直接聯絡店家。')+'</p><button id="checkApproval">重新確認狀態</button>';$('checkApproval').onclick=async()=>{const p=await getDoc(doc(db,'users',uid));if(p.exists())applyAccess(p.data());};}}
onAuthStateChanged(auth,async user=>{if(started)return;started=true;try{if(user?.uid===ADMIN){await signOut(auth);user=null}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;const p=await getDoc(doc(db,'users',uid));if(p.exists())applyAccess(p.data());else showCustomerPage('setup');}catch(e){const sub=$('splash')?.querySelector('.sub');if(sub)sub.textContent='連線失敗，請重新整理';}});
$("enableNotify").onclick=async()=>{try{if(!uid)throw Error("客人身分尚未完成");if(!("Notification"in window))throw Error("此裝置不支援通知");const p=await Notification.requestPermission();if(p!=="granted")throw Error("尚未允許通知");$("notifyStatus").textContent="正在設定通知…";if(!await syncPush())return;$("notifyStatus").textContent="✅ 訊息通知已開啟";$("notifyBox").classList.add("hidden")}catch(e){$("notifyStatus").textContent="通知設定失敗："+e.message}};$("start").onclick=async()=>{try{const name=$("name").value.trim(),phone=$("phone").value.normalize("NFKC").trim(),birthMonth=Number($("birthMonth").value),birthDay=Number($("birthDay").value);if(!name||!phone)throw Error("請填寫稱呼與聯絡電話；生日可稍後補填");if((birthMonth||birthDay)&&(!Number.isInteger(birthMonth)||!Number.isInteger(birthDay)||birthMonth<1||birthMonth>12||birthDay<1||birthDay>new Date(2000,birthMonth,0).getDate()))throw Error("請確認生日月日");await delivery.api(":commit",{method:"POST",body:JSON.stringify({writes:[
 {update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/users/"+uid,fields:{name:{stringValue:name},phone:{stringValue:phone},birthMonth:{integerValue:String(birthMonth)},birthDay:{integerValue:String(birthDay)},role:{stringValue:"customer"},gender:{stringValue:$("setupGender").value},status:{stringValue:"pending"}}},updateMask:{fieldPaths:["name","phone","birthMonth","birthDay","role","gender","status"]},updateTransforms:[{fieldPath:"joinedAt",setToServerValue:"REQUEST_TIME"},{fieldPath:"createdAt",setToServerValue:"REQUEST_TIME"},{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]}
 ]})});applyAccess({name,phone,birthMonth,birthDay,gender:$('setupGender').value,status:'pending'});}catch(e){if($("setupErr"))$("setupErr").textContent=e.code==="permission-denied"?"資料尚未存入，請聯絡店家確認帳號狀態；你填的內容會保留。":e.message}};
async function readPushDiag(){try{const r=await caches.match("/salon-space-chat/__push_diag__");if(!r){$("pushDiag").textContent="推播診斷：尚未收到背景推播";return}const d=await r.json();$("pushDiag").textContent="推播診斷："+d.stage+"｜"+new Date(d.at).toLocaleString()}catch(e){$("pushDiag").textContent="推播診斷讀取失敗"}}setTimeout(readPushDiag,1200);document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{$("text").value=b.dataset.quick;$("send").click()});$("send").onclick=()=>transmitChat(uid,$("text").value,uid,"customer",$("text"),$("send"));
suite=installSuite({auth,db,role:CHAT_ROLE,delivery,getChat:()=>currentChatView,renderChat:renderChatView,showPage:showCustomerPage,enableNotifications:async()=>{await $("enableNotify").onclick();return $("notifyStatus").textContent;}});


$("enterChat").onclick=()=>{history.pushState({salonChat:true},"","#chat");showCustomerPage("chat")};
$("leaveChat").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);showCustomerPage("inbox")};
window.addEventListener("popstate",()=>{if(uid&&profileReady)showCustomerPage(location.hash==="#chat"?"chat":"inbox")});
navigator.serviceWorker?.addEventListener("message",e=>{if(profileReady&&e.data?.type==="OPEN_NOTIFICATION_URL"){history.replaceState(null,"","#chat");showCustomerPage("chat")}});
$("chatShortcuts").onclick=()=>{const p=$("chatPanel");p.hidden=!p.hidden;$("chatShortcuts").setAttribute("aria-expanded",String(!p.hidden));$("chatShortcuts").textContent=p.hidden?"＋ 功能":"－ 收起"};
$("chatOptions").onclick=()=>{const p=$("chatDetails");p.hidden=!p.hidden;$("chatOptions").setAttribute("aria-expanded",String(!p.hidden));};
const syncChatViewport=()=>window.dispatchEvent(new Event("salon:viewport"));
function recoverCustomerView(){if(document.hidden)return;document.body.classList.add('customerApp');syncChatViewport();const id=document.body.dataset.page||'inbox';document.body.classList.toggle('conversationOpen',id==='chat');document.documentElement.classList.toggle('conversationOpen',id==='chat');if(uid&&profileReady){resumeVisibleReads();delivery.resume();}document.querySelectorAll('link[rel=stylesheet]').forEach(link=>{if(!link.sheet&&!link.dataset.retried){link.dataset.retried='1';const url=new URL(link.href);url.searchParams.set('recover','C14');link.href=url.href;}});if(id==='chat'){$('chatDetails').hidden=true;$('chatOptions').setAttribute('aria-expanded','false');}}
window.addEventListener('pageshow',recoverCustomerView);document.addEventListener('visibilitychange',recoverCustomerView);

</script></body></html>
