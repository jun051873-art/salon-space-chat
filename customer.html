<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest-customer.json">
<title>專屬空間</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1ea;color:#292722}
.app{max-width:720px;margin:auto;min-height:100vh;padding:20px}.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:99;background:#f5f1ea;display:flex;align-items:center;justify-content:center;text-align:center}
.logo{font-size:30px;font-weight:800}.sub{margin-top:10px;opacity:.55}
.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}h1{font-size:25px}
input,button{font:inherit}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;margin:6px 0}
button{padding:14px 18px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700}
#msgs{height:58vh;overflow:auto;padding:8px}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:78%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}
.composer{display:flex;gap:8px}.composer input{flex:1}.status{font-size:12px;opacity:.7;margin-top:8px}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:flex;gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(250,248,244,.96);backdrop-filter:blur(18px);border-top:1px solid #e4ddd4;z-index:50}.navBtn{flex:1;background:transparent;color:#716b63;padding:10px 4px;margin:0;border-radius:15px;font-size:12px}.navBtn span{display:block;font-size:22px;margin-bottom:3px}.navBtn.active{background:#292722;color:#fff}.placeholder{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center}.placeholder p{color:#817b72;line-height:1.7}.app{padding-bottom:100px}
/* visual refinement */
:root{--ink:#292722;--muted:#8b857d;--line:#e9e3da}
#chat>.card{background:rgba(255,255,255,.78);box-shadow:0 14px 40px rgba(70,58,42,.06)}
#msgs{padding:10px 2px 18px}.msg{max-width:76%;padding:11px 14px;margin:9px 0;border-radius:18px 18px 18px 6px;background:#fff;box-shadow:0 5px 18px rgba(70,58,42,.06);line-height:1.45}.msg.mine{margin-left:auto;border-radius:18px 18px 6px 18px;background:#292722;color:#fff}
.bottomNav{border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(70,58,42,.08)}.navBtn span{width:30px;height:30px;margin:0 auto 4px;display:grid;place-items:center;border-radius:10px;font-size:17px;background:rgba(41,39,34,.06)}.navBtn.active span{background:rgba(255,255,255,.15)}
.quickPills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.quickPills button{flex:0 0 auto;background:#eee9e2;color:#292722;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:650}.quickPills::-webkit-scrollbar{display:none}.msgWrap{display:flex;flex-direction:column;align-items:flex-start;margin:8px 0}.mineWrap{align-items:flex-end}.msgMeta{font-size:10px;color:#99938b;margin:3px 6px}.msgActions{display:flex;gap:5px;margin:2px 4px}.msgActions button{background:transparent;color:#8b857d;padding:3px 6px;font-size:10px;font-weight:600}.navBtn,.quickPills button{transition:transform .12s ease,opacity .12s ease,background-color .18s ease}.navBtn:active,.quickPills button:active{transform:scale(.985)}button:disabled{opacity:.55}</style></head>
<body>
<div id="splash"><div><div class="logo">專屬空間 SALON</div><div class="sub">連線中…</div></div></div>
<div class="app">
<h1>專屬空間 SALON</h1>
<section id="setup" class="card hidden">
<h2>第一次使用</h2>
<p>留下稱呼與手機，之後這台裝置會直接進入聊天室。</p>
<input id="name" placeholder="稱呼，例如：王小姐">
<input id="phone" placeholder="手機號碼"><div style="display:flex;gap:8px"><input id="birthMonth" inputmode="numeric" placeholder="生日月份，例如 5"><input id="birthDay" inputmode="numeric" placeholder="日期，例如 18"></div><p class="status">只需要月／日，不需要出生年份。</p>
<button id="start">開始使用</button>
<p id="setupErr" class="status"></p>
</section>
<section id="chat" class="hidden">
<div class="card"><h2>與專屬空間聊天</h2><div id="msgs"></div>
<div class="quickPills"><button data-quick="價目表">價目表</button><button data-quick="預約">預約</button><button data-quick="營業時間">營業時間</button></div><div class="composer"><input id="text" placeholder="輸入訊息…"><button id="send">傳送</button></div>
<div id="notifyBox" class="hidden" style="margin-top:14px"><button id="enableNotify">🔔 開啟訊息通知</button><p id="notifyStatus" class="status">開啟後，店家回覆時手機會提醒你。</p></div><p id="pushStatus" class="status"></p><p id="pushDiag" class="status"></p></div>
</section>
<section id="info" class="card hidden placeholder"><div><h2>🏠 SALON 資訊</h2><p>公告、休假日、活動與店家資訊<br>之後會顯示在這裡。</p></div></section>
<section id="gallery" class="card hidden placeholder"><div><h2>🖼 作品・產品</h2><p>作品照片、產品介紹與連結<br>之後會顯示在這裡。</p></div></section>
<nav id="customerNav" class="bottomNav hidden"><button class="navBtn active" data-customer-page="chat"><span>◉</span>聊天</button><button class="navBtn" data-customer-page="info"><span>⌂</span>SALON 資訊</button><button class="navBtn" data-customer-page="gallery"><span>▧</span>作品・產品</button></nav>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,updateDoc,writeBatch}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import{getMessaging,getToken}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js";
const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"};
const ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),messaging=getMessaging(app),$=id=>document.getElementById(id);
let uid,unsub,started=false;
function show(id){["setup","chat","info","gallery"].forEach(x=>$(x)?.classList.add("hidden"));$(id)?.classList.remove("hidden");$("splash")?.remove();if(id!=="setup")$("customerNav")?.classList.remove("hidden")}
function showCustomerPage(id){show(id);document.querySelectorAll("[data-customer-page]").forEach(b=>b.classList.toggle("active",b.dataset.customerPage===id))}
document.querySelectorAll("[data-customer-page]").forEach(b=>b.onclick=()=>showCustomerPage(b.dataset.customerPage));
function listen(){unsub?.();unsub=onSnapshot(query(collection(db,"chats",uid,"messages"),orderBy("createdAt","asc")),async s=>{
 $("msgs").innerHTML=s.docs.map(d=>{const m=d.data(),mine=m.senderId===uid,withdrawn=m.withdrawn===true,text=withdrawn?"此訊息已收回":escapeHtml(m.text||""),meta=[m.editedAt?"已編輯":"",mine&&m.readAt?"已讀":""].filter(Boolean).join(" · ");return '<div class="msgWrap '+(mine?"mineWrap":"")+'"><div class="msg '+(mine?"mine":"")+'">'+text+'</div>'+(meta?'<small class="msgMeta">'+meta+'</small>':"")+(mine&&!withdrawn?'<div class="msgActions"><button data-edit="'+d.id+'">編輯</button><button data-withdraw="'+d.id+'">收回</button></div>':"")+'</div>'}).join("");
 $("msgs").scrollTop=$("msgs").scrollHeight;
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{const snap=s.docs.find(x=>x.id===b.dataset.edit);const old=snap?.data()?.text||"";const next=prompt("編輯訊息",old);if(next!==null&&next.trim()&&next!==old)await updateDoc(doc(db,"chats",uid,"messages",b.dataset.edit),{text:next.trim(),editedAt:serverTimestamp()})});
 document.querySelectorAll("[data-withdraw]").forEach(b=>b.onclick=async()=>{if(confirm("收回這則訊息？"))await updateDoc(doc(db,"chats",uid,"messages",b.dataset.withdraw),{withdrawn:true,text:"",withdrawnAt:serverTimestamp()})});
 const batch=writeBatch(db);let n=0;s.docs.forEach(d=>{const m=d.data();if(m.senderId===ADMIN&&!m.readAt){batch.update(d.ref,{readAt:serverTimestamp()});n++}});if(n)await batch.commit()
})}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateNotifyUI(){const b=$("notifyBox");if(!b)return;if(!("Notification"in window)||Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPush(){try{if(Notification.permission!=="granted"||!("serviceWorker"in navigator)){updateNotifyUI();return;}const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");await navigator.serviceWorker.ready;const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});if(token)await setDoc(doc(db,"pushTokens",uid),{token,uid,role:"customer",updatedAt:serverTimestamp()},{merge:true})}catch(e){console.warn(e)}finally{updateNotifyUI()}}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
onAuthStateChanged(auth,async user=>{if(started)return;started=true;try{if(user?.uid===ADMIN){await signOut(auth);user=null}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;const p=await getDoc(doc(db,"users",uid));if(p.exists()){show("chat");$("text").value=localStorage.getItem("customerDraft")||"";listen();syncPush()}else show("setup")}catch(e){$("splash").querySelector(".sub").textContent="連線失敗，請重新整理"}});
$("enableNotify").onclick=async()=>{try{if(!uid)throw Error("客人身分尚未完成");if(!("Notification"in window))throw Error("此裝置不支援通知");const p=await Notification.requestPermission();if(p!=="granted")throw Error("尚未允許通知");$("notifyStatus").textContent="正在設定通知…";await syncPush();$("notifyStatus").textContent="✅ 訊息通知已開啟";$("notifyBox").classList.add("hidden")}catch(e){$("notifyStatus").textContent="通知設定失敗："+e.message}};$("start").onclick=async()=>{try{const name=$("name").value.trim(),phone=$("phone").value.trim(),birthMonth=Number($("birthMonth").value),birthDay=Number($("birthDay").value);if(!name||!phone||!birthMonth||!birthDay)throw Error("請填寫稱呼、手機與生日月日");if(birthMonth<1||birthMonth>12||birthDay<1||birthDay>31)throw Error("請確認生日月日");await setDoc(doc(db,"users",uid),{name,phone,birthMonth,birthDay,role:"customer",createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});await setDoc(doc(db,"chats",uid),{userId:uid,name,phone,lastMessage:"",updatedAt:serverTimestamp()},{merge:true});show("chat");$("text").value=localStorage.getItem("customerDraft")||"";listen();syncPush()}catch(e){$("setupErr").textContent=e.message}};
async function readPushDiag(){try{const r=await caches.match("/salon-space-chat/__push_diag__");if(!r){$("pushDiag").textContent="推播診斷：尚未收到背景推播";return}const d=await r.json();$("pushDiag").textContent="推播診斷："+d.stage+"｜"+new Date(d.at).toLocaleString()}catch(e){$("pushDiag").textContent="推播診斷讀取失敗"}}setTimeout(readPushDiag,1200);$("text").addEventListener("input",()=>localStorage.setItem("customerDraft",$("text").value));
document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{$("text").value=b.dataset.quick;localStorage.setItem("customerDraft",$("text").value);$("send").click()});
$("send").onclick=async()=>{
 const t=$("text").value.trim();if(!t)return;
 const btn=$("send");btn.disabled=true;btn.textContent="傳送中…";
 try{
  await addDoc(collection(db,"chats",uid,"messages"),{text:t,senderId:uid,senderRole:"customer",createdAt:serverTimestamp()});await setDoc(doc(db,"chats",uid),{lastMessage:t,updatedAt:serverTimestamp()},{merge:true});
 $("text").value="";localStorage.removeItem("customerDraft");
 btn.disabled=false;btn.textContent="傳送";
 }catch(e){
  $("pushStatus").textContent="⚠️ 訊息尚未送出，內容已保留，請檢查網路後再試";
  btn.disabled=false;btn.textContent="傳送";
  return;
 }
 try{const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:"admin",customerUid:uid,title:"專屬空間 SALON｜客人新訊息",body:t})});const out=await r.json();$("pushStatus").textContent=(r.ok&&out.ok)?("店家推播診斷：裝置 "+(out.devices??"-")+"｜成功 "+(out.success??"-")+"｜失敗 "+(out.failed??"-")):("通知傳送失敗："+JSON.stringify(out))}catch(e){$("pushStatus").textContent="通知傳送失敗"}};
</script></body></html>
