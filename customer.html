const pageTrail=createPageTrail();
function backCustomerPage(){const entry=pageTrail.back();showCustomerPage(entry.id,{back:true,scroll:entry.scroll});}
function showCustomerPage(id,options={}){if(!profileReady&&id!=="setup")id="setup";const splash=$("splash");if(!options.back)pageTrail.visit(id,Math.max(window.scrollY||0,document.querySelector(".app").scrollTop||0));if(["inbox","chat"].includes(id))delete document.body.dataset.returnToChat;else if(document.body.dataset.page==="chat")document.body.dataset.returnToChat="true";show(id,{keepSplash:!!splash});document.querySelector(".app").scrollTop=0;document.body.dataset.page=id;document.body.classList.toggle("detailOpen",["info","profile","preferences","featureDetail","holidays"].includes(id));document.body.classList.toggle("conversationOpen",id==="chat");document.documentElement.classList.toggle("conversationOpen",id==="chat");if(id==="chat"){if(uid)listen();}else{currentChatView?.feed.pause();suite?.stopReceipt();}const rendered=suite?.page(id);if(splash?.isConnected)void releaseCoverAfter(rendered,splash,()=>document.body.dataset.page===id);Promise.resolve(rendered).then(()=>{if(document.body.dataset.page===id){const y=options.scroll||0;document.querySelector(".app").scrollTop=y;window.scrollTo(0,y);}});document.querySelectorAll("[data-customer-page]").forEach(b=>b.classList.toggle("active",b.dataset.customerPage===(id==="chat"?"inbox":id)))}
document.querySelectorAll("[data-customer-page]").forEach(b=>b.onclick=()=>{pageTrail.reset();showCustomerPage(b.dataset.customerPage)});
function listen(){if(!profileReady)return;watchChat(uid,$("msgs"),uid)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
const notificationHelp=mountNotificationHelp($("inbox"),()=>$("enableNotify").onclick(),"customer");
function updateNotifyUI(){if(globalThis.Notification?.permission!=="granted")notificationHelp.update(false);const b=$("notifyBox");if(!b)return;if(!supportsPushAPIs()||Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}let pushSyncPending=null;function syncPush(){if(pushSyncPending)return pushSyncPending;pushSyncPending=performPushSync().finally(()=>pushSyncPending=null);return pushSyncPending;}async function performPushSync(){
 try{
  if(!supportsPushAPIs()||Notification.permission!=="granted"){updateNotifyUI();return false;}
  const messaging=await getChatMessaging();if(!messaging)throw Error("通知服務暫時無法啟動，請確認網路後再按一次開啟通知");
  const reg=await ensureNotificationWorker();
  const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!token)throw Error("未取得通知識別碼");
  await savePushToken("pushTokens/"+uid,{token,uid,role:"customer"});
  $("notifyBox").classList.add("hidden");notificationHelp.update(true);return true;
 }catch(e){notificationHelp.update(false,"通知尚未設定完成："+e.message);$("notifyStatus").textContent="通知尚未設定完成："+e.message;$("notifyBox").classList.remove("hidden");return false;}
}
window.addEventListener('salon:resume',()=>{if(profileReady){delivery.resume();resumeVisibleReads();if(Date.now()-pushCheckedAt>60000){pushCheckedAt=Date.now();void syncPush();}}});
let pushCheckedAt=0;document.addEventListener("visibilitychange",()=>{if(!document.hidden&&profileReady&&Date.now()-pushCheckedAt>60000){pushCheckedAt=Date.now();void syncPush();}});
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
let joinNoticeBusy=false,joinNoticeSent=false;
async function notifyJoin(){
 if(joinNoticeBusy||joinNoticeSent||!auth.currentUser)return;
 joinNoticeBusy=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 try{const url='https://salon-space-notify.jun051873.workers.dev/';const capabilities=await fetch(url,{signal:controller.signal}).then(r=>r.json());if(!capabilities.features?.newCustomerNotifications)return;
 const response=await fetch(url,{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+await auth.currentUser.getIdToken()},body:JSON.stringify({action:'customer-joined',customerUid:auth.currentUser.uid})});const result=await response.json();joinNoticeSent=response.ok&&result.ok&&!result.inProgress;
 }catch{}finally{clearTimeout(timer);joinNoticeBusy=false;}
}
function applyAccess(data){if(data.status==='pending')void notifyJoin();accountStatus=data.status||'active';profileReady=accountStatus==='active';if(profileReady){showCustomerPage(location.hash==='#chat'?'chat':'inbox');delivery.resume();syncPush();suite?.authReady(auth.currentUser,data);}else{currentChatView?.feed.pause();suite?.stopReceipt();showCustomerPage('setup');$('customerNav').classList.add('hidden');$('setup').innerHTML='<h2>'+ (accountStatus==='pending'?'等待店家核准':'目前無法使用')+'</h2><p>'+(accountStatus==='pending'?'申請已送出，店家核准後請按下方按鈕。':'此帳號已停用，請直接聯絡店家。')+'</p><button id="checkApproval">重新確認狀態</button><button class="softBtn" data-install-guide>安裝與使用教學</button>';$('checkApproval').onclick=async()=>{const p=await getDoc(doc(db,'users',uid));if(p.exists())applyAccess(p.data());};}}
onAuthStateChanged(auth,async user=>{if(started)return;started=true;try{if(user?.uid===ADMIN){show('setup');$('customerNav').classList.add('hidden');$('setup').innerHTML='<h2>這個瀏覽器已登入店家端</h2><p>為了保留店家登入，這裡不會切換成客人帳號，也不會建立新的顧客資料。</p><p>請讓客人用自己的手機開啟連結，先加入主畫面，再填寫資料。</p><a href="./admin.html" class="backLink" aria-label="返回店家端"><span aria-hidden="true">〈</span><span>返回</span></a>';return;}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;const p=await getDoc(doc(db,'users',uid));if(p.exists())applyAccess(p.data());else showCustomerPage('setup');}catch(e){const sub=$('splash')?.querySelector('.sub');if(sub)sub.textContent='連線失敗，請重新整理';}});
$("enableNotify").onclick=async()=>{try{if(!uid)throw Error("客人身分尚未完成");if(!supportsPushAPIs()||Notification.permission==="denied"){notificationHelp.guide();return;}if(!("Notification"in window))throw Error("此裝置不支援通知");const p=Notification.permission==="granted"?"granted":await Notification.requestPermission();if(p!=="granted")throw Error("尚未允許通知");$("notifyStatus").textContent="正在設定通知…";if(!await syncPush())return;$("notifyStatus").textContent="✅ 訊息通知已開啟";$("notifyBox").classList.add("hidden")}catch(e){notificationHelp.update(false,"通知設定失敗："+e.message);$("notifyStatus").textContent="通知設定失敗："+e.message}};$("start").onclick=async()=>{try{const name=$("name").value.trim(),phone=$("phone").value.normalize("NFKC").trim(),birthMonth=Number($("birthMonth").value),birthDay=Number($("birthDay").value);if(!name||!phone)throw Error("請填寫稱呼與聯絡電話；生日可稍後補填");if((birthMonth||birthDay)&&(!Number.isInteger(birthMonth)||!Number.isInteger(birthDay)||birthMonth<1||birthMonth>12||birthDay<1||birthDay>new Date(2000,birthMonth,0).getDate()))throw Error("請確認生日月日");await delivery.api(":commit",{method:"POST",body:JSON.stringify({writes:[
 {update:{name:"projects/"+cfg.projectId+"/databases/(default)/documents/users/"+uid,fields:{name:{stringValue:name},phone:{stringValue:phone},birthMonth:{integerValue:String(birthMonth)},birthDay:{integerValue:String(birthDay)},role:{stringValue:"customer"},gender:{stringValue:$("setupGender").value},status:{stringValue:"pending"}}},updateMask:{fieldPaths:["name","phone","birthMonth","birthDay","role","gender","status"]},updateTransforms:[{fieldPath:"joinedAt",setToServerValue:"REQUEST_TIME"},{fieldPath:"createdAt",setToServerValue:"REQUEST_TIME"},{fieldPath:"updatedAt",setToServerValue:"REQUEST_TIME"}]}
 ]})});applyAccess({name,phone,birthMonth,birthDay,gender:$('setupGender').value,status:'pending'});}catch(e){if($("setupErr"))$("setupErr").textContent=e.code==="permission-denied"?"資料尚未存入，請聯絡店家確認帳號狀態；你填的內容會保留。":e.message}};
async function readPushDiag(){try{const r=await caches.match("/salon-space-chat/__push_diag__");if(!r){$("pushDiag").textContent="推播診斷：尚未收到背景推播";return}const d=await r.json();$("pushDiag").textContent="推播診斷："+d.stage+"｜"+new Date(d.at).toLocaleString()}catch(e){$("pushDiag").textContent="推播診斷讀取失敗"}}setTimeout(readPushDiag,1200);document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{$("text").value=b.dataset.quick;$("chatPanel").hidden=true;$("chatShortcuts").setAttribute("aria-expanded","false");$("chatShortcuts").textContent="＋ 快速詢問";$("text").focus()});$("send").onclick=()=>transmitChat(uid,$("text").value,uid,"customer",$("text"),$("send"));
suite=installSuite({auth,db,role:CHAT_ROLE,delivery,getChat:()=>currentChatView,renderChat:renderChatView,showPage:showCustomerPage,goBack:backCustomerPage,backTarget:()=>pageTrail.target(),notificationGuide:()=>notificationHelp.guide(),enableNotifications:async()=>{await $("enableNotify").onclick();return $("notifyStatus").textContent;}});

$("chatCustomerName").onclick=()=>showCustomerPage("profile");

try{if(sessionStorage.getItem("salonGuideDismissed")==="1")$("customerGuideRibbon").hidden=true}catch{}
