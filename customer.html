<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest-customer.json">
<title>專屬空間</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1ea;color:#292722}
.app{max-width:720px;margin:auto;min-height:100vh;padding:20px}.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:99;background:#f5f1ea;display:flex;align-items:center;justify-content:center;text-align:center}
.logo{font-size:30px;font-weight:800}.sub{margin-top:10px;opacity:.55}
.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}h1{font-size:25px}
input,button{font:inherit}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;margin:6px 0}
button{padding:14px 18px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700}
#msgs{height:58vh;overflow:auto;padding:8px}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:78%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}
.composer{display:flex;gap:8px}.composer input{flex:1}.status{font-size:12px;opacity:.7;margin-top:8px}
</style></head>
<body>
<div id="splash"><div><div class="logo">專屬空間 SALON</div><div class="sub">連線中…</div></div></div>
<div class="app">
<h1>專屬空間 SALON</h1>
<section id="setup" class="card hidden">
<h2>第一次使用</h2>
<p>留下稱呼與手機，之後這台裝置會直接進入聊天室。</p>
<input id="name" placeholder="稱呼，例如：王小姐">
<input id="phone" placeholder="手機號碼">
<button id="start">開始使用</button>
<p id="setupErr" class="status"></p>
</section>
<section id="chat" class="hidden">
<div class="card"><h2>與專屬空間聊天</h2><div id="msgs"></div>
<div class="composer"><input id="text" placeholder="輸入訊息…"><button id="send">傳送</button></div>
<div id="notifyBox" class="hidden" style="margin-top:14px"><button id="enableNotify">🔔 開啟訊息通知</button><p id="notifyStatus" class="status">開啟後，店家回覆時手機會提醒你。</p></div><p id="pushStatus" class="status"></p><p id="pushDiag" class="status"></p></div>
</section>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import{getMessaging,getToken}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js";
const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"};
const ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",VAPID="BJEl8aiGHazU3HbeuXaJabs0omFsCTic-EBlYV9xox3EMN2Ns2C2EwbxYaUC-rcqYNlkKHvJxisZx7mE5T91RtI";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),messaging=getMessaging(app),$=id=>document.getElementById(id);
let uid,unsub,started=false;
function show(id){$("setup").classList.add("hidden");$("chat").classList.add("hidden");$(id).classList.remove("hidden");$("splash")?.remove()}
function listen(){unsub?.();unsub=onSnapshot(query(collection(db,"chats",uid,"messages"),orderBy("createdAt","asc")),s=>{$("msgs").innerHTML=s.docs.map(d=>{const m=d.data();return '<div class="msg '+(m.senderId===uid?"mine":"")+'">'+escapeHtml(m.text||"")+"</div>"}).join("");$("msgs").scrollTop=$("msgs").scrollHeight})}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateNotifyUI(){const b=$("notifyBox");if(!b)return;if(!("Notification"in window)||Notification.permission==="granted")b.classList.add("hidden");else b.classList.remove("hidden")}async function syncPush(){try{if(Notification.permission!=="granted"||!("serviceWorker"in navigator)){updateNotifyUI();return;}const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");await navigator.serviceWorker.ready;const token=await getToken(messaging,{vapidKey:VAPID,serviceWorkerRegistration:reg});if(token)await setDoc(doc(db,"pushTokens",uid),{token,uid,role:"customer",updatedAt:serverTimestamp()},{merge:true})}catch(e){console.warn(e)}finally{updateNotifyUI()}}
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
onAuthStateChanged(auth,async user=>{if(started)return;started=true;try{if(user?.uid===ADMIN){await signOut(auth);user=null}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;const p=await getDoc(doc(db,"users",uid));if(p.exists()){show("chat");listen();syncPush()}else show("setup")}catch(e){$("splash").querySelector(".sub").textContent="連線失敗，請重新整理"}});
$("enableNotify").onclick=async()=>{try{if(!uid)throw Error("客人身分尚未完成");if(!("Notification"in window))throw Error("此裝置不支援通知");const p=await Notification.requestPermission();if(p!=="granted")throw Error("尚未允許通知");$("notifyStatus").textContent="正在設定通知…";await syncPush();$("notifyStatus").textContent="✅ 訊息通知已開啟";$("notifyBox").classList.add("hidden")}catch(e){$("notifyStatus").textContent="通知設定失敗："+e.message}};$("start").onclick=async()=>{try{const name=$("name").value.trim(),phone=$("phone").value.trim();if(!name||!phone)throw Error("請填寫稱呼與手機");await setDoc(doc(db,"users",uid),{name,phone,role:"customer",createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});await setDoc(doc(db,"chats",uid),{userId:uid,name,phone,lastMessage:"",updatedAt:serverTimestamp()},{merge:true});show("chat");listen();syncPush()}catch(e){$("setupErr").textContent=e.message}};
async function readPushDiag(){try{const r=await caches.match("/salon-space-chat/__push_diag__");if(!r){$("pushDiag").textContent="推播診斷：尚未收到背景推播";return}const d=await r.json();$("pushDiag").textContent="推播診斷："+d.stage+"｜"+new Date(d.at).toLocaleString()}catch(e){$("pushDiag").textContent="推播診斷讀取失敗"}}setTimeout(readPushDiag,1200);$("send").onclick=async()=>{const t=$("text").value.trim();if(!t)return;$("text").value="";await addDoc(collection(db,"chats",uid,"messages"),{text:t,senderId:uid,senderRole:"customer",createdAt:serverTimestamp()});await setDoc(doc(db,"chats",uid),{lastMessage:t,updatedAt:serverTimestamp()},{merge:true});try{const r=await fetch("https://salon-space-notify.jun051873.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:"admin",customerUid:uid,title:"專屬空間 SALON｜客人新訊息",body:t})});const out=await r.json();$("pushStatus").textContent=(r.ok&&out.ok)?("店家推播診斷：裝置 "+(out.devices??"-")+"｜成功 "+(out.success??"-")+"｜失敗 "+(out.failed??"-")):("通知傳送失敗："+JSON.stringify(out))}catch(e){$("pushStatus").textContent="通知傳送失敗"}};
</script></body></html>
