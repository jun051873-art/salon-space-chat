<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1ea"><link rel="manifest" href="./manifest.json"><title>專屬空間 SALON</title></head>
<body style="font-family:system-ui;background:#f5f1ea;padding:24px"><p>正在開啟聊天室…</p><p><a href="./customer.html">客戶端</a> · <a href="./admin.html">店家端</a></p>
<script>
const params=new URLSearchParams(location.search);
let saved="";try{saved=localStorage.getItem("salonMode")||"";}catch{}
const mode=params.get("mode")||saved;
const target=new URL(mode==="admin"||params.has("chat")?"./admin.html":"./customer.html",location.href);
if(params.has("chat"))target.searchParams.set("chat",params.get("chat"));
location.replace(target.href);
</script></body></html>
