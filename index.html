<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專屬空間 Chat</title><style>body{margin:0;font-family:system-ui;background:#f5f1ea;color:#292722}.app{max-width:720px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:22px;margin:14px 0}button,input{font:inherit}button{padding:14px;border:0;border-radius:16px;background:#292722;color:#fff;font-weight:700;margin:5px}input{padding:14px;border:1px solid #ddd;border-radius:14px;width:calc(100% - 30px);margin:5px}.hidden{display:none}.msg{padding:10px 13px;border-radius:16px;margin:7px;max-width:75%;background:#fff}.mine{margin-left:auto;background:#292722;color:#fff}#msgs,#adminMsgs{height:48vh;overflow:auto}</style></head><body><div class="app"><h1>專屬空間 SALON</h1><div id="home" class="card"><h2>即時聊天</h2><button id="cust">我是客人</button><button id="shop">店家管理後台</button></div><div id="setup" class="card hidden"><h2>第一次使用</h2><input id="name" placeholder="稱呼"><input id="phone" placeholder="手機號碼"><button id="start">開始使用</button></div><div id="chat" class="card hidden"><h2>與專屬空間聊天</h2><div id="msgs"></div><input id="text" placeholder="輸入訊息"><button id="send">傳送</button></div><div id="login" class="card hidden"><h2>店家登入</h2><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="密碼"><button id="go">登入</button><p id="err"></p></div><div id="admin" class="card hidden"><h2>客戶訊息</h2><div id="list">目前沒有客人</div></div><div id="adminChat" class="card hidden"><button id="back">← 客戶列表</button><h2 id="who">聊天室</h2><div id="adminMsgs"></div><input id="reply" placeholder="輸入回覆"><button id="replyBtn">傳送</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInAnonymously,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyBS-lHTp1YPhhFOKriBRSrwdSomT3ZGw0c",authDomain:"salon-space-chat.firebaseapp.com",projectId:"salon-space-chat",storageBucket:"salon-space-chat.firebasestorage.app",messagingSenderId:"103245363547",appId:"1:103245363547:web:3f19674918bbf257a4c27e"},ADMIN="HcFJGmzHw6MYoWbFmtq9IyFSjvL2",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let uid,sel;function show(x){["home","setup","chat","login","admin","adminChat"].forEach(i=>$(i).classList.toggle("hidden",i!==x))}function listen(u,el,viewer){onSnapshot(query(collection(db,"chats",u,"messages"),orderBy("createdAt","asc")),s=>{el.innerHTML=s.docs.map(d=>{let m=d.data();return'<div class="msg '+(m.senderId===viewer?"mine":"")+'">'+(m.text||"")+"</div>"}).join("");el.scrollTop=el.scrollHeight})}async function send(u,t,sender,role){if(!t.trim())return;await addDoc(collection(db,"chats",u,"messages"),{text:t.trim(),senderId:sender,senderRole:role,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",u),{lastMessage:t.trim(),updatedAt:serverTimestamp()},{merge:true})}$("cust").onclick=async()=>{if(auth.currentUser?.uid===ADMIN)await signOut(auth);if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;let s=await getDoc(doc(db,"users",uid));if(s.exists()){show("chat");listen(uid,$("msgs"),uid)}else show("setup")};$("start").onclick=async()=>{let n=$("name").value.trim(),p=$("phone").value.trim();if(!n||!p)return alert("請填稱呼和手機");await setDoc(doc(db,"users",uid),{name:n,phone:p,role:"customer",createdAt:serverTimestamp()});await setDoc(doc(db,"chats",uid),{name:n,phone:p,lastMessage:"",updatedAt:serverTimestamp()});show("chat");listen(uid,$("msgs"),uid)};$("send").onclick=()=>{let t=$("text").value;$("text").value="";send(uid,t,uid,"customer")};$("shop").onclick=async()=>{if(auth.currentUser&&auth.currentUser.uid!==ADMIN)await signOut(auth);show("login")};$("go").onclick=async()=>{try{let c=await signInWithEmailAndPassword(auth,$("email").value,$("pw").value);if(c.user.uid!==ADMIN)throw Error("非管理員");show("admin");onSnapshot(query(collection(db,"chats"),orderBy("updatedAt","desc")),s=>{$("list").innerHTML=s.docs.map(d=>'<div class="card" data-u="'+d.id+'"><b>'+(d.data().name||"客人")+"</b><br>"+(d.data().lastMessage||"尚無訊息")+"</div>").join("")||"目前沒有客人";document.querySelectorAll("[data-u]").forEach(e=>e.onclick=async()=>{sel=e.dataset.u;let u=await getDoc(doc(db,"users",sel));$("who").textContent=u.data()?.name||"客人";show("adminChat");listen(sel,$("adminMsgs"),ADMIN)})})}catch(e){$("err").textContent="登入失敗："+e.message}};$("replyBtn").onclick=()=>{let t=$("reply").value;$("reply").value="";send(sel,t,ADMIN,"admin")};$("back").onclick=()=>show("admin");</script></body></html>
